explain why this isolation matters when a CUDA out-of-memory in your perception pipeline must never topple a walking biped, and how ROS 2 lifecycle management lets us deactivate Nav2 nodes mid-mission to reclaim 65% CPU for manipulation — then reactivate them in under a second with zero re-localisation.\n• Embodied AI & Tactile Manipulation: How we combine a real-time object detection pipeline for button detection at 25Hz with a two-phase manipulation strategy: MoveIt2 for collision-free arm trajectory planning, followed by a closed-loop visual servo that continuously corrects the push direction as the robot's upper body sways from its own arm movement. We will discuss how a dexterous robotic hand with force feedback detects contact with a spring-loaded rocker switch, and why getting a humanoid to press a doorbell-sized button is harder than it looks.\n• Door Traversal Under Time Pressure: The sliding door gives the robot a 6-second window. We will explain how a 3D LiDAR detects frosted glass as an obstacle, how costmap clearing serves as an implicit \"\"door opened\"\" signal, and why the robot must never stop in the doorway — because the PIR motion sensor only detects movement, not presence.\n• What's Next — Neural Manipulation with Foundation Models: A look ahead at our work-in-progress: training vision-language-action policies to enable the humanoid robot to autonomously walk to a pantry, visually identify a coffee cup among clutter, and grasp it with the dexterous hand — a task where classical motion planning struggles but learned neural policies excel.","type":"Lightning Talks","loc":"Level 5 Lightning Stage 2","topics":["Decade of GovTech: Looking Back, Moving Forward"],"speakers":[{"name":"Ebi JOSE","roles":["Staff Systems Engineer · GovTech Singapore"]}]},{"id":"9c2dea8a","day":5,"start":"14:30","end":"15:00","title":"The AI Enclave: Where Autonomous Agents Earn Trust","desc":"","type":"Plenaries","loc":"Level 5 Main Conference Hall","topics":[],"speakers":[{"name":"Jason HINDS","roles":["Senior Vice President, Solution Engineering · Snowflake"]}]},{"id":"0082c475","day":5,"start":"14:40","end":"15:00","title":"Ownself Gather: Democratising Case Management Across Government","desc":"Case management is one of the largest problem spaces in government. Almost every G2G, G2B, and G2C transaction is a case that has to be logged, tracked, and resolved somewhere. Yet case management systems have never been truly accessible - they require significant time, cost, and domain expertise, and come with overheads that are prohibitively expensive for agencies or teams. As a result, too many officers are still running critical workflows on spreadsheets and email threads. We believe every government officer deserves tools that match the importance of the work they do. Ownself Gather was built on that belief - a platform that democratises case management by letting agencies build their own bespoke case management apps, without the price tag or long time-to-market. This talk tells that origin story, and showcases what agencies across government have already built on it.","type":"Lightning Talks","loc":"Level 5 Lightning Stage 1","topics":["Supercharge Productivity: Engineering Velocity & Intent-Driven Development"],"speakers":[{"name":"TAY Jun Le","roles":["Software Engineer · GovTech Singapore"]}]},{"id":"4ff70729","day":5,"start":"14:40","end":"15:00","title":"What's Next for AI in Design Research?","desc":"AI has become an integral part of the design research process, helping researchers synthesise data, generate insights and accelerate workflows. But what comes next? This session explores the future of AI-augmented design research through the lens of behavioural science, showcasing how AI is already transforming research practice today and introducing the emerging concept of behaviourally calibrated synthetic users.","type":"Lightning Talks","loc":"Level 5 Lightning Stage 2","topics":["Designing for All: Digital Safety & Inclusivity"],"speakers":[{"name":"Falaumaina Bte Mohd SHARIL","roles":["Associate Director, Design Management · GovTech Singapore"]}]},{"id":"1ddc0f30","day":5,"start":"15:00","end":"15:30","title":"Frontier Minds, Thriving Teams: How Individuals and Organisations Harness AI to Thrive","desc":"The question has changed. We are no longer asking whether AI will transform work — that is settled. The question now is what we choose to become with it.\n\nThe organisations and individuals who thrive will not be those who adopt the most tools. They will be those who develop Frontier Minds — combining domain expertise with AI capability — and build Thriving Teams that redesign how work flows, not just how fast it moves.\n\nDrawing on research on Frontier Firms and Singapore’s refreshed National AI Strategy, this session maps a concrete blueprint for both.\n\nThe future starts today.","type":"Plenaries","loc":"Level 5 Main Conference Hall","topics":["Unleashing AI Autonomy: Beyond Chatbots","Supercharge Productivity: Engineering Velocity & Intent-Driven Development"],"speakers":[{"name":"TOK Wee Hyong","roles":["Partner Director of Products · Microsoft"]}]},{"id":"be2f6d6a","day":5,"start":"15:00","end":"15:20","title":"Singapore's Maritime Digital Twin — Bringing the Port to Life","desc":"Singapore's port handles over 100,000 vessel calls a year — but behind that scale, keeping it running smoothly requires real-time awareness, sharp coordination, and the ability to anticipate problems before they happen. Until recently, the data needed to manage our port waters was fragmented across agencies and operators, decisions were largely reactive, and there was no single platform that could give every stakeholder a unified, real-time picture of what was happening across our maritime domain. We were facing the paradox of a highly space-constrained environment that still demanded unlimited opportunities for innovation and growth. \n\nThis is the challenge that the Maritime Digital Twin (MDT) was built to address. Developed in partnership with GovTech, MDT brings together live data streams from across Singapore's port waters into a single, dynamic digital environment — powered by GovTech's Open Digital Platform, an open-standard middleware layer that integrates data from multiple agencies and systems without vendor lock-in. More than a visualisation tool, MDT is a platform for prediction, planning, and collaboration, progressing along the digital twin maturity curve from real-time awareness toward predictive and prescriptive capabilities. \n\nIn this talk, MPA will share how MDT has moved beyond government walls to research on predicting oil and chemical spill dispersion in our port waters. By integrating computational fluid dynamics models, the platform generates critical \"\"what-if\"\" scenarios. During MPA's recent chemical spill exercises, we demonstrated how overlaying live weather and sea-current data onto these models allows us to visualise the spread of hazardous chemicals and calculate the safest evacuation routes for nearby vessels. \n\nWe will also showcase how MDT's 3D simulation capabilities are transforming maritime emergency preparedness and capacity planning, allowing response teams to rehearse for incidents in an immersive, realistic digital environment before they ever occur. By integrating different data sources including live drone feeds to create a single window view across the coastline, and mapping historical traffic density, we can test new operating concepts before actual investment. Whether you're a technologist, a policymaker, or simply curious about how Singapore stays ahead in the digital age, this talk offers a rare look at what it means to build a living, breathing digital replica of one of the world's most critical maritime hubs.","type":"Lightning Talks","loc":"Level 5 Lightning Stage 1","topics":["Anticipate the Future: Data-Enabled User Experience"],"speakers":[{"name":"Gio KUO","roles":["Lead Product Manager · Maritime and Port Authority of Singapore"]},{"name":"WONG Zhi Qian","roles":["Full-Stack Developer · GovTech Singapore"]}]},{"id":"853ce1b3","day":5,"start":"15:00","end":"15:20","title":"Can Your Grandmother Use It? A Talk About Why Inclusive Design Keeps Failing and Three Shifts That Change That","desc":"We talk about digital inclusivity constantly. We publish guidelines, run co-design workshops, and tick accessibility boxes. And yet an elderly who can't complete a government form, the person with low vision navigating a portal never tested with a screen reader, the caregiver managing digital access for someone else — they are still falling through the gap.\n\nThe answer is uncomfortable. Inclusive design keeps failing not because we lack intention, but because the wrong people are shaping it. Discovery workshops run on Miro, in offices, during working hours. The people who show up are digitally confident, articulate, and nothing like the citizens who will struggle most with what gets built. Three things need to change: the elderly, they need to be in the room from day one — not reviewed at the end; services need to be built in their language and on platforms they already uses; and their reality needs to be tested with real prototypes in real hands, not wireframes asking them to imagine an interface they has never seen.\n\nThree deliberate shifts in discovery and co-design: going to where excluded users actually are; testing with real functional prototypes using AI-assisted tools like vibe coding; and designing for the platforms people already use rather than the ones we wish they would adopt. These shifts only stick when organisations change how they reward, recognize, and resource inclusive design work — not just how they run workshops.\n\nDesign for the hardest user and the service gets better for everyone. Bigger text helps someone with low vision — and also helps someone in bright sunlight. Simpler language helps someone with cognitive difficulty — and also helps any first-time user. The question every product team and delivery lead should ask before any sprint begins: can your grandmother use it? And if the honest answer is no — that is where the design work begins.","type":"Lightning Talks","loc":"Level 5 Lightning Stage 2","topics":["Designing for All: Digital Safety & Inclusivity"],"speakers":[{"name":"Sangar ANNADORAI","roles":["Head of Kyndryl Vital, ASEAN & Korea · Kyndryl"]}]},{"id":"7d35747e","day":5,"start":"15:20","end":"15:40","title":"One Catalog Mesh, Five Golden Paths: How SDP Enables Zero-Copy Data Sharing Across WoG","desc":"Before the Standard Data Platform (SDP), government agencies each chose their own data solutions. Bespoke data platforms here, homegrown pipelines there. Fragmented. Expensive. No interoperability.\n\nSDP changes this with five golden paths: Databricks, Snowflake, Microsoft Fabric, AWS SageMaker, and Google Agentic Data Cloud. But the real challenge isn't choosing a platform. It's making them talk to each other once agencies pick different ones.\n\nEnter Iceberg Catalog Federation. Elizabeth will show how SDP wires together each platform's native Iceberg REST Catalog into a single mesh, so an agency on Databricks can query datasets from an agency on Snowflake without copying data, building pipelines, or compromising governance. Zero copy, zero pipeline, full control.","type":"Lightning Talks","loc":"Level 5 Lightning Stage 1","topics":["Anticipate the Future: Data-Enabled User Experience"],"speakers":[{"name":"Elizabeth TAN","roles":["Data Engineer · GovTech Singapore"]}]},{"id":"3436d7fb","day":5,"start":"15:20","end":"15:40","title":"No Lesson Paid for Twice: Operational Continuity Through AI","desc":"Everyone who's used an AI agent has hit the same wall: a great session, then you close the window and it's gone. Next session starts blank.\n\nMost teams building agent tooling are racing on the same axis — more skills, more pipelines, more context. This talk is about the other axis: continuity. What it actually takes for an AI-native team to never re-explain the same thing twice, told through one real, dated example from GovTech's Innovation Office — plus the honest part, where it hasn't scaled to everyone yet.\n\nA practitioner's account, not a platform pitch: what worked, where it broke, and two prompts you can try Monday morning.","type":"Lightning Talks","loc":"Level 5 Lightning Stage 2","topics":["Unleashing AI Autonomy: Beyond Chatbots"],"speakers":[{"name":"Darren NG","roles":["Lead, Programme Management and Operations · GovTech Singapore"]}]},{"id":"9ec2d9da","day":5,"start":"15:30","end":"16:00","title":"Measuring What Matters: Data, AI, and the New Economics of Outcomes","desc":"More tokens. More agents. More output. But does more AI activity actually equal more business value?\nFor twenty years, we’ve measured data platforms by their deliverables: queries processed, dashboards built, and active users. Humans still did the hard part of turning that information into action.\n\nAs AI starts to take on more of that work, those old measures start to look very different.\n\nThis session looks at the emerging evidence on AI ROI, why some of the metrics we’re reaching for tell us very little about value, and what data leaders should measure instead. We look at what this shift means for the data foundations underneath AI, and what needs to change as data moves from informing decisions to increasingly driving action.","type":"Plenaries","loc":"Level 5 Main Conference Hall","topics":["Anticipate the Future: Data-Enabled User Experience"],"speakers":[{"name":"Anna CONIGLIO","roles":["Head of Customer Engineering, Data Analytics - APAC · Google"]}]},{"id":"25bb6417","day":5,"start":"15:40","end":"16:00","title":"Voncierge: Beyond Chatbots, Toward AI That Acts","desc":"The most common question in almost every building is \"Where's the nearest toilet?\", asked thousands of times a day, in a dozen languages, often when the counter is closed. Physical spaces still run on people, but frontline roles are hard to fill, visitor volumes keep climbing, and phones have reset what \"fast\" means. Chatbots were the first fix, but they only answer. Someone who has lost a wallet or found a broken lift needs an outcome, not a phone number.\n\nDrawing on Voncierge's deployments in airports, office buildings, malls and community centres, Nikhil Gupta shows what separates AI that answers from AI that acts, and why acting is harder: it needs physical context, integration with legacy systems, and clear accountability when an action goes wrong. He argues that the hardest design decision is when the AI should stop and hand over to a human, illustrated by one Singapore airport deployment where 2-5 staff on shift handle over 30,000 calls a month. The talk closes with three lessons for teams starting out (start with the question log, design the exit before the entrance, budget for integration rather than intelligence) and a short thought experiment on what help could look like in Singapore in 2031.","type":"Lightning Talks","loc":"Level 5 Lightning Stage 1","topics":["Unleashing AI Autonomy: Beyond Chatbots"],"speakers":[{"name":"Nikhil GUPTA","roles":["Co-founder and Chief Executive Officer · Voncierge Private Limited"]}]},{"id":"1d8ec9b2","day":5,"start":"15:40","end":"16:00","title":"QwenWork: An Intelligent Engine for Growth","desc":"Enterprises have moved past the chatbot phase. On a daily basis, AI drafts emails, summarizes meetings, writes code on. What is still hard to reach is each organisation's custom knowledge: its standards, pricing logic, client history and so on. \n\nQwenWork makes the case that the bottleneck isn't the model - it's context and orchestration. An intelligent engine that plugs into the stack you already have (ex. Microsoft 365, Slack, WhatsApp), and grounds itself in your enterprise knowledge, and runs workflows end-to-end while people set the goals. This session walks through what that looks like in production: \n\nA legal staffer describes the document; an agent in an isolated sandbox installs its own tooling, researches, fills the template, and delivers it - no code, no local installs.\n\nA pitch video from one prompt. Presenter image, lip-synced video, slides rebuilt, final composition - with the agent selecting the best model for each step across image, video, and audio, and the orchestration itself disappearing. \n\nAt Goodme - one of the largest tea chains in the world, recipes, equipment troubleshooting, and market knowledge become a queryable enterprise context.\n\nSales that scale without headcount. Digital employees absorb the slow-response, uncertain-pricing workload — with approval-in-the-loop, least-privilege access, sandboxed execution, and full audit trails on every action they take. \n\nUnderneath it all: multi-model access to SOTA image, video, and audio generation, browser automation for web application without APIs, scheduled tasks that run in the cloud, and an OpenAPI for building your own programmatic agents.\n\nAttendees will leave with a working mental model of the AI-native work platform, and the one principle that decides who wins as agents take over execution: context is all you need.","type":"Lightning Talks","loc":"Level 5 Lightning Stage 2","topics":["Unleashing AI Autonomy: Beyond Chatbots"],"speakers":[{"name":"Jacob SI","roles":["Global Solution Evangelist, Enterprise AI · Alibaba Cloud Singapore Pte Ltd"]}]},{"id":"438e32e5","day":5,"start":"16:00","end":"16:30","title":"Beyond Identity: Building Trust with Data and AI","desc":"How does a national identity platform earn trust at every level, across its own systems, the citizens who use it, and the businesses and agencies that build on it? Winston goes behind the scenes of Singpass to show how data and AI, applied in the right order, turn the information a platform already holds into safer, simpler and more trusted digital services.","type":"Plenaries","loc":"Level 5 Main Conference Hall","topics":["Anticipate the Future: Data-Enabled User Experience","Designing for All: Digital Safety & Inclusivity"],"speakers":[{"name":"Winston TEO","roles":["Senior Director, Engineering Management, Singpass, Government Digital Products · GovTech Singapore"]}]},{"id":"6a486486","day":5,"start":"16:00","end":"16:20","title":"Airlift: Accelerating Developer Productivity with Ephemeral Workspaces","desc":"As AI agents become active participants in software delivery, development environments must evolve beyond traditional workstations and long-lived virtual machines.\n\nAirlift is a secure remote workspace platform built for the Singapore Government ecosystem. Powered by ContainerStack and running on Kubernetes, Airlift provides ephemeral development environments—called Crafts—that can be created on demand by developers and AI agents alike.\n\nThis lightning talk explores how ephemeral workspaces increase engineering velocity while improving security by encouraging Git-native workflows, reducing configuration drift, and preventing secret exposure during AI-assisted development. Attendees will learn how Airlift integrates with SHIP-HATS and Platform AI to enable software development, where developers and agents can move seamlessly from idea to execution in a secure, governed environment.","type":"Lightning Talks","loc":"Level 5 Lightning Stage 1","topics":["Supercharge Productivity: Engineering Velocity & Intent-Driven Development"],"speakers":[{"name":"Soedarsono","roles":["Staff Software Engineer · GovTech Singapore"]}]},{"id":"b33acbb1","day":5,"start":"16:00","end":"16:20","title":"From Passive Tools to Intelligent Partners: The Agentic Enterprise Blueprint","desc":"Most enterprise software wasn’t built for the world we operate in today. Organisations spend millions on packaged platforms where teams use less than 40% of available features, poor user experience drives low adoption, and vendor lock-in limits agility. At the same time, AI is evolving fast enough to fundamentally reshape how enterprises operate—if organisations are bold enough to act.\n\nThis talk presents a blueprint drawn from Thoughtworks’ own enterprise transformation: replacing costly, rigid SaaS platforms with intelligent, autonomous agentic systems that don’t just support business processes but increasingly run them.\n\nWe will share the vision and roadmap for building an Agentic Enterprise, shifting from passive COTS dependency to AI-native operations across the enterprise value chain—from quote-to-cash and hire-to-retire to knowledge management, digital workplace, and service delivery.\n\nThis transformation is built on a deliberate five-layer architecture:\n• Foundation Layer enabling model governance, agent discovery, security, and observability.\n• Integration & Data Layer connecting enterprise systems without requiring large-scale rebuilding.\n• Agent Intelligence Layer where AI Buddy acts as an orchestrator, routing intent across specialised agents through context-aware logic.\n• Domain Solutions Layer where agents handle areas such as service management, license optimisation, knowledge management, digital workplace, and cross-functional business processes.\n • Experience & Adoption Layer ensuring humans remain meaningfully in the loop through conversational interfaces, role-based design, and feedback loops that improve agent behaviour over time.\n\n Crucially, this transformation does not rely on a big-bang replacement strategy. We will share our “Prove then Scale” approach—starting with high-impact use cases that demonstrate measurable ROI, and then expanding the transformation across the enterprise.\n\nAttendees will leave with a practical framework for sequencing the journey, governing autonomous systems responsibly, and creating the organisational conditions where agentic AI can deliver not just efficiency, but genuine enterprise transformation.\n\nThis session offers candid insights from Thoughtworks’ own journey—navigating complexity, making difficult architectural decisions, and learning what it takes to move from software-driven enterprises to AI-native operations.","type":"Lightning Talks","loc":"Level 5 Lightning Stage 2","topics":["Unleashing AI Autonomy: Beyond Chatbots"],"speakers":[{"name":"Sujana Arul Selvi ALAGURAJ","roles":["Product Leader · Thoughtworks"]}]},{"id":"7ba22849","day":5,"start":"16:30","end":"17:00","title":"Trust Needs Receipts - Rethinking Trust in the Age of AI","desc":"As artificial intelligence reshapes our digital world, how do we know what or whom to trust? In this engaging closing keynote, Dr. Alissa Abdullah explores four dimensions of digital trust: information, evidence, context, and identity. Through an unexpected demonstration she challenges traditional assumptions about credibility and authenticity.\n\nThe message is not to fear AI, but to embrace its possibilities while rethinking how we establish trust. Because in the age of AI, trust needs receipts.","type":"Keynotes","loc":"Level 5 Main Conference Hall","topics":[],"speakers":[{"name":"Alissa ABDULLAH","roles":["Deputy Chief Security Officer · Mastercard"]}]}]};

const VENUES = [
  { key: "Level 5 Main Conference Hall", short: "Main Conference Hall", cls: "v-hall" },
  { key: "Level 5 Lightning Stage 1", short: "Lightning Stage 1", cls: "v-s1" },
  { key: "Level 5 Lightning Stage 2", short: "Lightning Stage 2", cls: "v-s2" }
];
const DAYS = [{ d: 4, label: "Wed 4 Nov" }, { d: 5, label: "Thu 5 Nov" }];
const COLORS = ["#2f62d6", "#c23b80", "#16834a", "#c2410c", "#7438d9", "#0b7f8f", "#9a6b00", "#b31942", "#4b5563", "#5b4bd1"];
const TYPE = { "Lightning Talks": "Lightning talk", "Plenaries": "Plenary", "Keynotes": "Keynote", "Opening Address": "Opening address", "Panel Discussions": "Panel" };
const KEY = "stack26-planner-v1";

const toMin = t => { const [h, m] = t.split(":").map(Number); return h * 60 + m; };
const fmt = m => String(Math.floor(m / 60)).padStart(2, "0") + ":" + String(m % 60).padStart(2, "0");
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const topicShort = t => t.split(":")[0];
const dayLabel = d => DAYS.find(x => x.d === d).label;

const S = DATA.sessions.map(s => ({ ...s, a: toMin(s.start), b: toMin(s.end) }));
const byId = Object.fromEntries(S.map(s => [s.id, s]));
const venueOf = s => VENUES.find(v => v.key === s.loc) || VENUES[0];
const org = r => r.split(" · ").pop();
const overlaps = (x, y) => x.id !== y.id && x.day === y.day && x.a < y.b && y.a < x.b;

let state = { people: [], picks: {}, active: null, day: 4, view: null };
try { const saved = JSON.parse(localStorage.getItem(KEY)); if (saved && Array.isArray(saved.people)) state = { ...state, ...saved }; } catch (e) {}
if (!state.view) state.view = window.matchMedia("(max-width: 760px)").matches ? "list" : "grid";
const ui = { q: "", topic: "", onlyOpen: false, onlyMine: false };
function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }

const person = id => state.people.find(p => p.id === id);
const goers = sid => (state.picks[sid] || []).filter(person);
const initials = n => n.trim().split(/\s+/).map(w => w[0]).slice(0, 2).join("").toUpperCase();
const avatar = (p, bad) => `<span class="av${bad ? " bad" : ""}" style="background:${p.color}" title="${esc(p.name)}${bad ? " (clash)" : ""}">${esc(initials(p.name))}</span>`;

function speakerLine(s) {
  const parts = s.speakers.map(x => x.name + (x.roles[0] ? ` (${org(x.roles[0])})` : ""));
  return parts.length > 2 ? parts.slice(0, 2).join(", ") + ` +${parts.length - 2} more` : parts.join(", ");
}

// For each person: the set of their sessions that overlap another of their sessions.
function clashes() {
  const out = {};
  for (const p of state.people) {
    const mine = S.filter(s => goers(s.id).includes(p.id));
    out[p.id] = new Set(mine.filter(s => mine.some(o => overlaps(s, o))).map(s => s.id));
  }
  return out;
}

function matches(s) {
  if (ui.topic && !s.topics.includes(ui.topic)) return false;
  if (ui.onlyOpen && goers(s.id).length) return false;
  if (ui.onlyMine && state.active && !goers(s.id).includes(state.active)) return false;
  if (ui.q) {
    const hay = (s.title + " " + s.desc + " " + s.speakers.map(x => x.name + " " + x.roles.join(" ")).join(" ")).toLowerCase();
    if (!ui.q.toLowerCase().split(/\s+/).every(w => hay.includes(w))) return false;
  }
  return true;
}

function card(s, cl) {
  const who = goers(s.id).map(person);
  const bad = who.filter(p => cl[p.id].has(s.id));
  const act = person(state.active);
  const on = act && goers(s.id).includes(act.id);
  const v = venueOf(s);
  const key = s.type !== "Lightning Talks";
  return `<article class="s ${v.cls}${bad.length ? " clash" : ""}${matches(s) ? "" : " dim"}">
    <div class="s-top"><span class="time">${s.start}–${s.end}</span><span class="pill${key ? " key" : ""}">${TYPE[s.type] || s.type}</span><span class="venue">${v.short}</span></div>
    <h3><button type="button" class="s-open" data-open="${s.id}">${esc(s.title)}</button></h3>
    <p class="spk">${esc(speakerLine(s))}</p>
    ${bad.length ? `<span class="clash-note">Clash for ${esc(bad.map(p => p.name).join(", "))}</span>` : ""}
    <div class="s-foot"><span class="who">${who.map(p => avatar(p, cl[p.id].has(s.id))).join("")}</span>
    ${act ? `<button type="button" class="assign${on ? " on" : ""}" data-assign="${s.id}" aria-pressed="${on}">${on ? "✓ " : "+ "}${esc(act.name)}</button>` : ""}</div>
  </article>`;
}

function renderGrid(cl) {
  const ds = S.filter(s => s.day === state.day);
  const t0 = Math.min(...ds.map(s => s.a)), t1 = Math.max(...ds.map(s => s.b));
  const row = m => (m - t0) / 5 + 2;
  let h = `<div></div>` + VENUES.map((v, i) => `<div class="g-head ${v.cls}" style="grid-column:${i + 2}">${v.short}<small>Level 5</small></div>`).join("");
  [...new Set(ds.map(s => s.a))].sort((a, b) => a - b).forEach(m => { h += `<div class="g-time" style="grid-column:1;grid-row:${row(m)}">${fmt(m)}</div>`; });
  // Shade time ranges where no venue has a session (the lunch break).
  for (let m = t0, gap = null; m <= t1; m += 5) {
    const busy = m < t1 && ds.some(s => s.a <= m && m < s.b);
    if (!busy && gap === null && m < t1) gap = m;
    if ((busy || m === t1) && gap !== null) {
      h += `<div class="g-break" style="grid-column:2/5;grid-row:${row(gap)}/${row(m)}">Lunch break · ${fmt(gap)}–${fmt(m)}</div>`;
      gap = null;
    }
  }
  ds.forEach(s => { const vi = VENUES.indexOf(venueOf(s)); h += `<div class="g-cell" style="grid-column:${vi + 2};grid-row:${row(s.a)}/${row(s.b)}">${card(s, cl)}</div>`; });
  return `<div class="grid-scroll"><div class="grid" style="grid-template-rows:auto repeat(${(t1 - t0) / 5}, minmax(7px, auto))">${h}</div></div>`;
}

function renderList(cl) {
  const ds = S.filter(s => s.day === state.day);
  const starts = [...new Set(ds.map(s => s.a))].sort((a, b) => a - b);
  return `<div class="list">` + starts.map(m => {
    const group = ds.filter(s => s.a === m).sort((x, y) => VENUES.indexOf(venueOf(x)) - VENUES.indexOf(venueOf(y)));
    const any = group.some(matches);
    return `<section class="slot${any ? "" : " hidden"}"><h3 class="slot-time">${fmt(m)}</h3><div class="slot-cards">${group.map(s => card(s, cl)).join("")}</div></section>`;
  }).join("") + `</div>`;
}

function renderSidebar(cl) {
  const act = person(state.active);
  document.getElementById("teamHint").textContent = state.people.length
    ? (act ? `Planning for ${act.name}. Tap “+ ${act.name}” on a talk to add it, or pick another colleague below.` : "Pick a colleague below, then tap + on the talks they should attend.")
    : "Add the colleagues you're planning for. Then pick one and tap + on the talks they should attend.";
  document.getElementById("people").innerHTML = state.people.map(p => {
    const mine = S.filter(s => goers(s.id).includes(p.id));
    const n = cl[p.id].size;
    return `<div class="person" role="button" tabindex="0" data-person="${p.id}" aria-pressed="${p.id === state.active}">
      ${avatar(p)}<span class="nm">${esc(p.name)}</span>
      <span class="ct">${mine.length} talk${mine.length === 1 ? "" : "s"}${n ? ` · <b>${n} clashing</b>` : ""}</span>
      <button type="button" class="rm" data-remove="${p.id}" aria-label="Remove ${esc(p.name)}">×</button></div>`;
  }).join("");
  document.getElementById("cover").innerHTML = state.people.length ? DAYS.map(d => {
    const ds = S.filter(s => s.day === d.d), c = ds.filter(s => goers(s.id).length).length;
    return `<div><div style="display:flex;justify-content:space-between"><span>${d.label}</span><span style="font-variant-numeric:tabular-nums">${c} of ${ds.length} talks covered</span></div><div class="meter"><i style="width:${(c / ds.length) * 100}%"></i></div></div>`;
  }).join("") : "";
  document.getElementById("plan").innerHTML = state.people.length ? state.people.map(p => {
    const mine = S.filter(s => goers(s.id).includes(p.id)).sort((x, y) => x.day - y.day || x.a - y.a);
    const body = mine.length ? DAYS.map(d => {
      const items = mine.filter(s => s.day === d.d);
      return items.length ? `<div class="plan-day">${d.label}</div>` + items.map(s => {
        const bad = cl[p.id].has(s.id);
        return `<button type="button" class="plan-item${bad ? " bad" : ""}" data-open="${s.id}"><span class="t">${s.start}–${s.end}</span><span>${bad ? `<span class="x">Clash · </span>` : ""}${esc(s.title)}</span></button>`;
      }).join("") : "";
    }).join("") : `<p class="empty">No talks yet.</p>`;
    return `<div class="plan-person"><h3>${avatar(p)}${esc(p.name)}</h3>${body}</div>`;
  }).join("") : `<p class="empty">Each colleague's schedule shows up here once you add talks.</p>`;
  document.getElementById("onlyMineLabel").textContent = act ? `Only ${act.name}'s talks` : "Only the selected colleague's talks";
  document.getElementById("onlyMine").disabled = !act;
}

function render() {
  const cl = clashes();
  document.querySelectorAll("#days button").forEach(b => b.setAttribute("aria-pressed", String(+b.dataset.day === state.day)));
  document.querySelectorAll("#views button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.view === state.view)));
  document.getElementById("schedule").innerHTML = state.view === "grid" ? renderGrid(cl) : renderList(cl);
  renderSidebar(cl);
  if (dlg.open && dlg.dataset.sid) openSession(dlg.dataset.sid, true);
  save();
}

/* ---------- Session details ---------- */
const dlg = document.getElementById("dlg");
function openSession(sid, refresh) {
  const s = byId[sid]; if (!s) return;
  const cl = clashes(), v = venueOf(s);
  const same = S.filter(o => overlaps(s, o)).sort((x, y) => x.a - y.a);
  dlg.dataset.sid = sid;
  document.getElementById("dlgBody").innerHTML = `
    <div class="dlg-head"><h2 id="dlgTitle">${esc(s.title)}</h2><button class="rm" type="button" data-close aria-label="Close">×</button></div>
    <div class="meta"><span class="time">${dayLabel(s.day)} · ${s.start}–${s.end}</span><span class="s ${v.cls}" style="all:unset"><span class="venue" style="color:var(--${v.cls.slice(2)})">${v.short}</span></span><span class="pill">${TYPE[s.type] || s.type}</span>${s.topics.map(t => `<span class="pill">${esc(topicShort(t))}</span>`).join("")}</div>
    <div><h3>Who's going</h3>${state.people.length ? `<div class="goers" style="margin-top:8px">${state.people.map(p => {
      const on = goers(sid).includes(p.id), bad = on && cl[p.id].has(sid);
      return `<label class="goer${bad ? " bad" : ""}" for="g-${p.id}"><input type="checkbox" id="g-${p.id}" data-toggle="${p.id}" ${on ? "checked" : ""}>${avatar(p)}${esc(p.name)}${bad ? " · clash" : ""}</label>`;
    }).join("")}</div>` : `<p class="empty" style="margin-top:6px">Add colleagues in the Team panel to assign this talk.</p>`}</div>
    <div><h3>Speaker${s.speakers.length > 1 ? "s" : ""}</h3><ul class="spk-list" style="margin-top:8px">${s.speakers.map(x => `<li><strong>${esc(x.name)}</strong><br><span>${x.roles.map(esc).join("<br>")}</span></li>`).join("")}</ul></div>
    ${s.desc ? `<div><h3>About this talk</h3><p class="desc" style="margin-top:8px">${esc(s.desc)}</p></div>` : ""}
    ${same.length ? `<div><h3>At the same time</h3><div class="same" style="margin-top:6px">${same.map(o => `<button type="button" data-open="${o.id}"><span class="t">${o.start}–${o.end}</span><span><strong>${venueOf(o).short}</strong> · ${esc(o.title)}</span></button>`).join("")}</div></div>` : ""}`;
  if (!refresh) { dlg.showModal(); dlg.scrollTop = 0; }
}
dlg.addEventListener("close", () => { delete dlg.dataset.sid; });

/* ---------- Actions ---------- */
function toggle(sid, pid) {
  const list = new Set(state.picks[sid] || []);
  list.has(pid) ? list.delete(pid) : list.add(pid);
  if (list.size) state.picks[sid] = [...list]; else delete state.picks[sid];
  render();
}
const toast = document.getElementById("toast"); let undoSnap = null, toastTimer;
function showToast(msg, snap) {
  undoSnap = snap; document.getElementById("toastMsg").textContent = msg;
  document.getElementById("toastUndo").hidden = !snap; toast.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { toast.hidden = true; undoSnap = null; }, 6000);
}
document.getElementById("toastUndo").addEventListener("click", () => { if (undoSnap) { state = undoSnap; undoSnap = null; toast.hidden = true; render(); } });

function addPerson(name, color) {
  const used = new Set(state.people.map(p => p.color));
  const p = { id: Math.random().toString(36).slice(2, 9), name, color: color || COLORS.find(c => !used.has(c)) || COLORS[state.people.length % COLORS.length] };
  state.people.push(p); return p;
}
document.getElementById("addForm").addEventListener("submit", e => {
  e.preventDefault();
  const inp = document.getElementById("newName"), name = inp.value.trim(), st = document.getElementById("addStatus");
  if (!name) { st.textContent = "Type a name first."; return; }
  if (state.people.some(p => p.name.toLowerCase() === name.toLowerCase())) { st.textContent = `${name} is already on the team.`; return; }
  const p = addPerson(name); state.active = p.id; inp.value = ""; st.textContent = "";
  render();
});

document.addEventListener("click", e => {
  const t = e.target.closest("[data-open],[data-assign],[data-remove],[data-person],[data-close],[data-day],[data-view]");
  if (!t) return;
  if (t.dataset.close !== undefined) { t.closest("dialog").close(); return; }
  if (t.dataset.remove) {
    e.stopPropagation();
    const snap = JSON.parse(JSON.stringify(state)), p = person(t.dataset.remove);
    state.people = state.people.filter(x => x.id !== p.id);
    for (const k in state.picks) { state.picks[k] = state.picks[k].filter(x => x !== p.id); if (!state.picks[k].length) delete state.picks[k]; }
    if (state.active === p.id) state.active = state.people[0] ? state.people[0].id : null;
    render(); showToast(`Removed ${p.name}.`, snap); return;
  }
  if (t.dataset.open) { openSession(t.dataset.open, dlg.open); if (dlg.open) dlg.scrollTop = 0; return; }
  if (t.dataset.assign) { toggle(t.dataset.assign, state.active); return; }
  if (t.dataset.person) { state.active = state.active === t.dataset.person ? null : t.dataset.person; render(); return; }
  if (t.dataset.day) { state.day = +t.dataset.day; render(); return; }
  if (t.dataset.view) { state.view = t.dataset.view; render(); }
});
document.addEventListener("keydown", e => {
  const t = e.target.closest && e.target.closest("[data-person]");
  if (t && e.target === t && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); t.click(); }
});
dlg.addEventListener("change", e => { if (e.target.dataset.toggle) toggle(dlg.dataset.sid, e.target.dataset.toggle); });

document.getElementById("q").addEventListener("input", e => { ui.q = e.target.value.trim(); render(); });
document.getElementById("topic").addEventListener("change", e => { ui.topic = e.target.value; render(); });
document.getElementById("onlyOpen").addEventListener("change", e => { ui.onlyOpen = e.target.checked; render(); });
document.getElementById("onlyMine").addEventListener("change", e => { ui.onlyMine = e.target.checked; render(); });

/* ---------- Sharing ---------- */
function planText() {
  const cl = clashes();
  const lines = ["STACK Conference 2026: who's going where", DATA.location, ""];
  for (const p of state.people) {
    const mine = S.filter(s => goers(s.id).includes(p.id));
    lines.push(`${p.name} (${mine.length} talk${mine.length === 1 ? "" : "s"})`);
    for (const d of DAYS) {
      const items = mine.filter(s => s.day === d.d).sort((x, y) => x.a - y.a);
      if (!items.length) continue;
      lines.push(`  ${d.label}`);
      items.forEach(s => lines.push(`  ${s.start}–${s.end}  ${s.title} [${venueOf(s).short}]${cl[p.id].has(s.id) ? "  (CLASH)" : ""}`));
    }
    if (!mine.length) lines.push("  No talks yet");
    lines.push("");
  }
  const open = S.filter(s => !goers(s.id).length).length;
  lines.push(`Talks nobody is going to: ${open} of ${S.length}`);
  return lines.join("\n");
}
function planCode() {
  const idx = Object.fromEntries(state.people.map((p, i) => [p.id, i]));
  const k = {}; for (const sid in state.picks) { const v = goers(sid).map(pid => idx[pid]); if (v.length) k[sid] = v; }
  const json = JSON.stringify({ p: state.people.map(p => [p.name, p.color]), k });
  return "STACK26:" + btoa(unescape(encodeURIComponent(json)));
}
function loadCode(code) {
  const m = code.trim().match(/STACK26:([A-Za-z0-9+/=]+)/);
  if (!m) throw new Error("That doesn't look like a plan code. It should start with STACK26:");
  const data = JSON.parse(decodeURIComponent(escape(atob(m[1]))));
  const ids = data.p.map(([name, color]) => {
    const found = state.people.find(p => p.name.toLowerCase() === String(name).toLowerCase());
    return (found || addPerson(String(name).slice(0, 24), state.people.some(p => p.color === color) ? null : color)).id;
  });
  let n = 0;
  for (const sid in data.k) {
    if (!byId[sid]) continue;
    const set = new Set(state.picks[sid] || []);
    data.k[sid].forEach(i => { if (ids[i] && !set.has(ids[i])) { set.add(ids[i]); n++; } });
    state.picks[sid] = [...set];
  }
  if (!state.active && state.people[0]) state.active = state.people[0].id;
  return { people: data.p.length, n };
}
async function copy(text, st) {
  try { await navigator.clipboard.writeText(text); st.textContent = "Copied. Paste it into Telegram."; }
  catch (e) { st.textContent = "Couldn't copy automatically. Select the text above and copy it."; }
}
const share = document.getElementById("share");
function openShare(mode) {
  const body = document.getElementById("shareBody");
  if (mode === "text") {
    document.getElementById("shareTitle").textContent = "Plan for Telegram";
    body.innerHTML = `<textarea class="code" id="outText" readonly aria-label="Plan text">${esc(planText())}</textarea>
      <div class="row-btns"><button class="btn primary" type="button" id="cpText">Copy text</button></div><p class="status" id="stText" role="status"></p>`;
    share.showModal();
    const st = document.getElementById("stText");
    document.getElementById("cpText").addEventListener("click", () => copy(planText(), st));
    copy(planText(), st);
    return;
  }
  document.getElementById("shareTitle").textContent = "Share or load a plan";
  body.innerHTML = `<p class="hint">Send this code to a colleague. When they paste it below on their copy of this page, they get the same team and picks.</p>
    <textarea class="code" id="outCode" readonly aria-label="Your plan code" style="min-height:90px">${esc(planCode())}</textarea>
    <div class="row-btns"><button class="btn primary" type="button" id="cpCode">Copy plan code</button></div>
    <p class="status" id="stCode" role="status"></p>
    <h3 style="font:600 13px/1.3 var(--font-body);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)">Load a plan from a colleague</h3>
    <textarea class="code" id="inCode" aria-label="Paste a plan code" placeholder="Paste a STACK26: code here" style="min-height:90px"></textarea>
    <div class="row-btns"><button class="btn" type="button" id="ldCode">Add to my plan</button></div>
    <p class="status" id="stLoad" role="status"></p>`;
  share.showModal();
  document.getElementById("cpCode").addEventListener("click", () => copy(planCode(), document.getElementById("stCode")));
  document.getElementById("ldCode").addEventListener("click", () => {
    const st = document.getElementById("stLoad");
    try { const snap = JSON.parse(JSON.stringify(state)); const r = loadCode(document.getElementById("inCode").value); render(); st.textContent = `Loaded ${r.people} colleague${r.people === 1 ? "" : "s"} and ${r.n} new pick${r.n === 1 ? "" : "s"}.`; document.getElementById("outCode").value = planCode(); showToast("Plan loaded.", snap); }
    catch (e) { st.textContent = e.message.startsWith("That") ? e.message : "That code couldn't be read. Check it was copied in full."; }
  });
}
document.getElementById("copyText").addEventListener("click", () => openShare("text"));
document.getElementById("shareCode").addEventListener("click", () => openShare("code"));

/* ---------- Init ---------- */
document.getElementById("loc").textContent = DATA.location;
document.getElementById("days").innerHTML = DAYS.map(d => `<button type="button" data-day="${d.d}">${d.label}</button>`).join("");
const topics = [...new Set(S.flatMap(s => s.topics))];
document.getElementById("topic").innerHTML += topics.map(t => `<option value="${esc(t)}">${esc(topicShort(t))}</option>`).join("");
if (state.active && !person(state.active)) state.active = null;
render();
</script>
</body>
</html>
