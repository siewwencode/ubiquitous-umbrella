<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>STACK 2026 Talk Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: timetable on the left (rows = 5-minute slots, columns = venues), team plan in a sticky sidebar. */
:root {
  --bg: #f2f4f8;
  --surface: #ffffff;
  --ink: #131a2a;
  --muted: #5a6478;
  --line: #dbe0e9;
  --accent: #2346d8;
  --accent-ink: #ffffff;
  --hall: #6a3fd0;
  --s1: #0d857a;
  --s2: #b8620a;
  --danger: #cc2338;
  --danger-bg: #fdecee;
  --break: #e8ebf1;
  --font-display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --font-body: "IBM Plex Sans", "Segoe UI", Roboto, Arial, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1118; --surface: #161c27; --ink: #e7ebf2; --muted: #98a2b4; --line: #283142;
    --accent: #8099ff; --accent-ink: #0d1118; --hall: #ab8cff; --s1: #3cc5b5; --s2: #eea24a;
    --danger: #ff6d7f; --danger-bg: #3a1820; --break: #1b2230; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1118; --surface: #161c27; --ink: #e7ebf2; --muted: #98a2b4; --line: #283142;
  --accent: #8099ff; --accent-ink: #0d1118; --hall: #ab8cff; --s1: #3cc5b5; --s2: #eea24a;
  --danger: #ff6d7f; --danger-bg: #3a1820; --break: #1b2230; color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 15px/1.45 var(--font-body); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
.wrap { max-width: 1440px; margin: 0 auto; padding: 0 20px; }

header.top { padding: 24px 0 14px; display: flex; flex-wrap: wrap; gap: 8px 24px; align-items: end; justify-content: space-between; }
.brand h1 { font: 800 clamp(24px, 3.2vw, 34px)/1.05 var(--font-display); letter-spacing: -0.01em; }
.brand p { margin: 6px 0 0; color: var(--muted); }
.brand a { color: var(--accent); }

.bar { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; padding: 10px 0 16px; border-bottom: 1px solid var(--line); }
.seg { display: inline-flex; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 3px; }
.seg button { border: 0; background: none; padding: 7px 14px; border-radius: 7px; cursor: pointer; font-weight: 600; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.field { display: inline-flex; align-items: center; gap: 6px; }
.field input[type="search"], .field select { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; min-width: 0; }
.field input[type="search"] { width: 220px; }
.check { display: inline-flex; gap: 6px; align-items: center; color: var(--muted); font-size: 14px; cursor: pointer; }

.layout { display: grid; grid-template-columns: minmax(0, 1fr) 330px; gap: 24px; padding: 18px 0 48px; align-items: start; }
@media (max-width: 1000px) { .layout { grid-template-columns: 1fr; } .side { order: -1; position: static !important; max-height: none !important; } }

/* ---------- Sidebar ---------- */
.side { position: sticky; top: 12px; max-height: calc(100vh - 24px); overflow: auto; display: grid; gap: 16px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: grid; gap: 12px; }
.panel h2 { font: 800 16px/1.2 var(--font-display); letter-spacing: 0.01em; }
.hint { margin: 0; color: var(--muted); font-size: 13.5px; }
.add { display: flex; gap: 8px; }
.add input { flex: 1; min-width: 0; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 7px 12px; font-weight: 600; cursor: pointer; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.people { display: grid; gap: 6px; }
.person { display: grid; grid-template-columns: auto 1fr auto auto; gap: 8px; align-items: center; padding: 6px 8px; border-radius: 9px; border: 1px solid transparent; cursor: pointer; background: none; text-align: left; width: 100%; }
.person:hover { background: var(--bg); }
.person[aria-pressed="true"] { border-color: var(--accent); background: var(--bg); }
.person .nm { font-weight: 600; overflow-wrap: anywhere; }
.person .ct { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.person .ct b { color: var(--danger); font-weight: 600; }
.rm { border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 18px; line-height: 1; padding: 2px 6px; border-radius: 6px; }
.rm:hover { color: var(--danger); background: var(--danger-bg); }
.av { display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; color: #fff; font: 600 11px/1 var(--font-body); flex: none; }
.av.bad { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--danger); }
.cover { display: grid; gap: 6px; font-size: 13.5px; }
.meter { height: 6px; background: var(--break); border-radius: 3px; overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--accent); }
.plan-person { display: grid; gap: 4px; }
.plan-person h3 { display: flex; gap: 8px; align-items: center; font: 600 14px/1.3 var(--font-body); }
.plan-day { font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin-top: 4px; }
.plan-item { display: grid; grid-template-columns: 92px 1fr; gap: 8px; font-size: 13px; border: 0; background: none; text-align: left; padding: 3px 4px; border-radius: 6px; cursor: pointer; }
.plan-item:hover { background: var(--bg); }
.plan-item .t { font: 500 12px/1.6 var(--font-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.plan-item.bad .t { color: var(--danger); }
.plan-item .x { color: var(--danger); font-weight: 600; }
.row-btns { display: flex; flex-wrap: wrap; gap: 8px; }
.empty { color: var(--muted); font-size: 13.5px; margin: 0; }

/* ---------- Session card ---------- */
.s { --v: var(--accent); position: relative; background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--v); border-radius: 9px; padding: 8px 10px; display: flex; flex-direction: column; gap: 4px; height: 100%; transition: opacity .15s; }
.s.v-hall { --v: var(--hall); } .s.v-s1 { --v: var(--s1); } .s.v-s2 { --v: var(--s2); }
.s.dim { opacity: 0.28; }
.s.clash { background: linear-gradient(var(--danger-bg), var(--danger-bg)); border-color: var(--danger); border-left-color: var(--danger); }
.s-top { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; font-size: 12px; color: var(--muted); }
.time { font: 500 12px/1.4 var(--font-mono); font-variant-numeric: tabular-nums; color: var(--ink); }
.pill { border: 1px solid var(--line); border-radius: 99px; padding: 0 7px; font-size: 11px; line-height: 17px; white-space: nowrap; }
.pill.key { border-color: var(--v); color: var(--v); font-weight: 600; }
.venue { font-weight: 600; color: var(--v); font-size: 12px; }
.s h3 { font: 600 14px/1.3 var(--font-body); }
.s-open { all: unset; cursor: pointer; overflow-wrap: anywhere; }
.s-open:hover { text-decoration: underline; text-underline-offset: 2px; }
.s-open:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
.spk { margin: 0; font-size: 12.5px; color: var(--muted); }
.s-foot { margin-top: auto; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; justify-content: space-between; padding-top: 2px; }
.who { display: flex; flex-wrap: wrap; gap: 3px; }
.assign { border: 1px dashed var(--muted); background: none; border-radius: 99px; padding: 1px 10px; font-size: 12.5px; font-weight: 600; cursor: pointer; color: var(--muted); max-width: 100%; overflow-wrap: anywhere; }
.assign:hover { border-color: var(--accent); color: var(--accent); }
.assign.on { border-style: solid; border-color: var(--accent); background: var(--accent); color: var(--accent-ink); }
.clash-note { font-size: 12px; color: var(--danger); font-weight: 600; }

/* ---------- Timetable grid ---------- */
.grid-scroll { overflow-x: auto; }
.grid { display: grid; grid-template-columns: 56px repeat(3, minmax(190px, 1fr)); column-gap: 10px; min-width: 680px; }
.g-head { position: sticky; top: 0; z-index: 2; background: var(--bg); padding: 4px 0 10px; font: 800 14px/1.2 var(--font-display); border-bottom: 3px solid var(--v); margin-bottom: 8px; }
.g-head small { display: block; font: 400 12px/1.3 var(--font-body); color: var(--muted); }
.g-head.v-hall { --v: var(--hall); } .g-head.v-s1 { --v: var(--s1); } .g-head.v-s2 { --v: var(--s2); }
.g-time { font: 500 12px/1 var(--font-mono); color: var(--muted); padding-top: 9px; border-top: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.g-cell { padding: 4px 0; min-width: 0; }
.g-break { display: grid; place-items: center; margin: 4px 0; border-radius: 9px; background: repeating-linear-gradient(135deg, var(--break) 0 8px, transparent 8px 16px); color: var(--muted); font-size: 13px; font-weight: 600; min-height: 56px; }
.grid .venue { display: none; }

/* ---------- List view ---------- */
.list { display: grid; gap: 18px; }
.slot { display: grid; grid-template-columns: 64px 1fr; gap: 12px; }
.slot-time { font: 500 14px/1.6 var(--font-mono); color: var(--muted); padding-top: 6px; }
.slot-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; }
.slot.hidden { display: none; }
.list .s.dim { display: none; }
@media (max-width: 520px) { .slot { grid-template-columns: 1fr; gap: 4px; } .slot-cards { grid-template-columns: 1fr; } .field input[type="search"] { width: 100%; } .field.grow { flex: 1 1 100%; } }

/* ---------- Dialogs ---------- */
dialog { border: 1px solid var(--line); border-radius: 14px; background: var(--surface); color: var(--ink); padding: 0; width: min(680px, calc(100vw - 32px)); max-height: calc(100vh - 48px); }
dialog::backdrop { background: rgba(10, 14, 22, 0.55); }
.dlg { padding: 20px 22px 22px; display: grid; gap: 14px; }
.dlg-head { display: flex; gap: 12px; justify-content: space-between; align-items: start; }
.dlg h2 { font: 800 21px/1.2 var(--font-display); }
.dlg .meta { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-size: 13.5px; color: var(--muted); }
.dlg .desc { white-space: pre-line; max-width: 65ch; margin: 0; }
.dlg h3 { font: 600 13px/1.3 var(--font-body); text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
.spk-list { display: grid; gap: 6px; margin: 0; padding: 0; list-style: none; }
.spk-list span { color: var(--muted); font-size: 13.5px; }
.goers { display: flex; flex-wrap: wrap; gap: 8px; }
.goer { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 99px; padding: 3px 10px 3px 4px; cursor: pointer; font-size: 14px; }
.goer input { margin: 0 2px 0 4px; }
.goer.bad { border-color: var(--danger); color: var(--danger); }
.same { display: grid; gap: 4px; }
.same button { all: unset; cursor: pointer; display: grid; grid-template-columns: 96px 1fr; gap: 8px; font-size: 13.5px; padding: 4px 6px; border-radius: 6px; }
.same button:hover, .same button:focus-visible { background: var(--bg); }
.same .t { font: 500 12px/1.6 var(--font-mono); color: var(--muted); }
textarea.code { width: 100%; min-height: 180px; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px; font: 12.5px/1.5 var(--font-mono); resize: vertical; }
.status { font-size: 13.5px; color: var(--muted); min-height: 1.2em; margin: 0; }

.toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 14px; border-radius: 10px; display: flex; gap: 12px; align-items: center; font-size: 14px; z-index: 10; }
.toast button { background: none; border: 0; color: inherit; text-decoration: underline; font-weight: 600; cursor: pointer; }
.toast[hidden] { display: none; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>STACK 2026 Talk Planner</h1>
      <p><span id="loc"></span> · Wed 4 and Thu 5 Nov · 60 talks across 3 stages · <a href="https://www.developer.tech.gov.sg/communities/events/conferences/stack-conference-2026/programme">Official programme</a></p>
    </div>
  </header>

  <div class="bar" role="toolbar" aria-label="Schedule controls">
    <div class="seg" id="days" aria-label="Day"></div>
    <div class="seg" id="views" aria-label="View">
      <button type="button" data-view="grid">Timetable</button>
      <button type="button" data-view="list">List</button>
    </div>
    <label class="field grow" for="q"><span class="hint">Search</span><input type="search" id="q" placeholder="Talk, speaker or organisation"></label>
    <label class="field" for="topic"><span class="hint">Topic</span><select id="topic"><option value="">All topics</option></select></label>
    <label class="check" for="onlyOpen"><input type="checkbox" id="onlyOpen"> Only talks nobody is going to</label>
    <label class="check" for="onlyMine"><input type="checkbox" id="onlyMine"> <span id="onlyMineLabel">Only the selected colleague's talks</span></label>
  </div>

  <div class="layout">
    <main id="schedule" aria-live="polite"></main>
    <aside class="side">
      <section class="panel" aria-labelledby="teamH">
        <h2 id="teamH">Team</h2>
        <p class="hint" id="teamHint"></p>
        <form class="add" id="addForm" autocomplete="off">
          <input id="newName" maxlength="24" placeholder="Colleague's name" aria-label="Colleague's name">
          <button class="btn primary" type="submit">Add</button>
        </form>
        <p class="status" id="addStatus" role="status"></p>
        <div class="people" id="people"></div>
        <div class="cover" id="cover"></div>
      </section>
      <section class="panel" aria-labelledby="planH">
        <h2 id="planH">Who's going where</h2>
        <div id="plan" class="people"></div>
        <div class="row-btns">
          <button class="btn primary" type="button" id="copyText">Copy plan for Telegram</button>
          <button class="btn" type="button" id="shareCode">Share or load plan</button>
        </div>
        <p class="hint">Your plan is saved in this browser only. To give it to someone else, use Share or load plan.</p>
      </section>
    </aside>
  </div>
</div>

<dialog id="dlg" aria-labelledby="dlgTitle"><div class="dlg" id="dlgBody"></div></dialog>
<dialog id="share" aria-labelledby="shareTitle">
  <div class="dlg">
    <div class="dlg-head"><h2 id="shareTitle">Share or load a plan</h2><button class="rm" type="button" data-close aria-label="Close">×</button></div>
    <div id="shareBody" style="display:grid;gap:12px"></div>
  </div>
</dialog>
<div class="toast" id="toast" hidden><span id="toastMsg"></span><button type="button" id="toastUndo">Undo</button></div>

<script>
const DATA = {"location":"Sands Expo and Convention Centre","sessions":[{"id":"b0936797","day":4,"start":"09:45","end":"10:00","title":"Opening Address","desc":"","type":"Opening Address","loc":"Level 5 Main Conference Hall","topics":[],"speakers":[{"name":"Jasmin LAU","roles":["Senior Minister of State · Ministry of Digital Development and Information","Acting Minister · Ministry of Manpower","Minister-in-charge · GovTech Singapore"]}]},{"id":"a4971af5","day":4,"start":"10:00","end":"10:30","title":"Reimagining our Digital Government: Building the Next Chapter Together","desc":"","type":"Keynotes","loc":"Level 5 Main Conference Hall","topics":[],"speakers":[{"name":"GOH Wei Boon","roles":["Chief Executive · GovTech Singapore"]}]},{"id":"e4d28834","day":4,"start":"10:30","end":"11:00","title":"A New Era of the Internet","desc":"The Internet was built for people. But in May 2026, bot traffic surpassed human traffic for the first time—a milestone that signals a profound shift in how information is discovered, work gets done, and businesses create value.\n\nWe are entering the agentic Internet: a world where non-human actors do not just crawl, scrape, or attack websites, but increasingly transact, recommend, negotiate, and make decisions on behalf of people and organizations. For businesses, that shift creates enormous opportunity—and real risk. Bots are no longer simply a nuisance or a security threat. Systems designed around a human on the other end now face new questions. How do you identify software acting on someone’s behalf? What should it be allowed to do? Who is accountable when it acts? And how does the economic model of the open web hold up when the visitor isn’t a person?\n\nMichelle Zatlyn, Co-founder and President of Cloudflare, will share what roughly 20% of the world’s web traffic reveals: how quickly this transition is happening, what it means for the teams building the next generation of digital experiences, and why the choices being made today will shape the Internet we all rely on.","type":"Keynotes","loc":"Level 5 Main Conference Hall","topics":["The Future of Cloud: Sustainable, Resilient, & Effortless"],"speakers":[{"name":"Michelle ZATLYN","roles":["Co-founder, President & Co-chair · Cloudflare"]}]},{"id":"f1f11c11","day":4,"start":"11:00","end":"11:30","title":"Cleared for Autonomy: What It Takes to Deploy Agentic AI Responsibly","desc":"The next generation of AI won't wait for instructions. It plans, executes, and adapts. Explore the emerging \"agentic stack\" powering autonomous workflows: from foundation models and tool-use frameworks to memory, reasoning, and self-correction. Drawing on lessons from Amazon's own experience, this session examines the engineering, guardrails, and accountability mechanisms needed to deploy autonomous AI responsibly, balancing speed and autonomy with oversight and explainability, and how teams themselves are evolving along the way.","type":"Plenaries","loc":"Level 5 Main Conference Hall","topics":["Unleashing AI Autonomy: Beyond Chatbots","Supercharge Productivity: Engineering Velocity & Intent-Driven Development"],"speakers":[{"name":"Vishal SHARMA","roles":["Vice President, Amazon Artificial General Intelligence, Information and Multimodal AI Experience · Amazon"]}]},{"id":"3abdeefe","day":4,"start":"11:30","end":"12:15","title":"The Trusted and Sustainable Frontier: Balancing Resilience with Responsibility","desc":"As AI places new demands on digital infrastructure, organisations face a growing challenge: how do we deliver the performance required for increasingly complex workloads while remaining secure, resilient, sustainable, and responsibly governed? This panel explores how these priorities can be balanced in practice, from engineering resilience and compliance into systems by design to managing real-world operational risks and strengthening resilience across increasingly interconnected ecosystems.","type":"Panel Discussions","loc":"Level 5 Main Conference Hall","topics":["The Future of Cloud: Sustainable, Resilient, & Effortless","Designing for All: Digital Safety & Inclusivity"],"speakers":[{"name":"David FOO","roles":["Deputy Chief Executive · Maritime and Port Authority of Singapore"]},{"name":"Florian TURSKY","roles":["Managing Director · Global GovTech Centre"]},{"name":"Michelle ZATLYN","roles":["Co-founder, President & Co-chair · Cloudflare"]},{"name":"Vishal SHARMA","roles":["Vice President, Amazon Artificial General Intelligence, Information and Multimodal AI Experience · Amazon"]},{"name":"Wen HUANG","roles":["Senior Director, Enablement, Transformations & Consulting (ETC), Government Digital Transformation (GDT) · GovTech Singapore"]}]},{"id":"e47f254c","day":4,"start":"13:00","end":"13:20","title":"MAS AI-Powered Dev Platform: Scaling Velocity with GovTech Platform AI and SHIP-HATS","desc":"In this 15-minute lightning talk, we explore MAS's journey from traditional VM-based environments to a sandboxed Cloud Development Environment (CDE) on the Government Commercial Cloud (GCC), and how AI is now woven into every layer of the developer experience.\n\nThrough SHIP-HATS, MAS migrated from on-premise Bitbucket to a centralized GitLab instance, embedding SonarQube and SonaType software supply chain tools to left-shift DevSecOps directly to the development stage. The MAS Developer Workspace lets developers spin up isolated dev boxes in seconds across five languages (C#, Java, Python, TypeScript, JavaScript), with monthly base image updates eliminating runtime inconsistencies.\n\nAt the AI layer, the MAS AI Gateway assigns every developer a dedicated virtual key - unlocking seamless, compliant access to AWS Bedrock and GovTech Platform AI, with centralised MCP server management that amplifies developers' AI coding capability. Claude Code comes preinstalled with an agent security harness: guardrails and security hooks that prevent sensitive data from reaching LLMs. Developers further benefit from Anthropic's preinstalled Agent Skills and the MAS Agent Skills Marketplace, an inner-source platform for sharing purpose-built skills, fueling use cases from software development to document authoring.\n\nKey Features of the Talk:\n• Sandboxed CDE on GCC: Rapid workspace spin-ups, multi-language support, and monthly image updates for consistent, cloud-preserved dev environments.\n• Left-Shifting DevSecOps: Migrating to SHIP-HATS (GitLab) and embedding SonarQube and SonaType tools at the development stage.\n• Secure AI Agents with Claude Code: Agent security harness with guardrails and hooks, plus Anthropic Skills and the inner-source MAS Agent Skills Marketplace.\n• AI Gateway & MCP Governance: Centralized virtual keys, Agent Skills, MCP servers, and full observability across GovTech Platform AI and AWS Bedrock.","type":"Lightning Talks","loc":"Level 5 Lightning Stage 1","topics":["Supercharge Productivity: Engineering Velocity & Intent-Driven Development"],"speakers":[{"name":"Ron ZHONG","roles":["Deputy Director and Senior Solution Architect · Monetary Authority of Singapore"]}]},{"id":"1a46f851","day":4,"start":"13:00","end":"13:20","title":"When Your User Is a Machine. Government Services By, For, and With AI","desc":"Agentic interactions will become an increasingly important consideration in the government services we create. The main focus at the moment is on building AI capability to drive greater productivity, but we are also seeing agents acting on behalf of citizens and the need for creating our own agents to support those transactions.  How do we design for the world of M2M  experiences in the Singapore Government context? Are human-centred design principles still relevant in a world of agentic interactions? \n\nThis talk will explore several themes including: \n• From user journey to user agent journey\n• From friction removal to friction management\n• From human-in-the-loop to the human-centred loop","type":"Lightning Talks","loc":"Level 5 Lightning Stage 2","topics":["Unleashing AI Autonomy: Beyond Chatbots"],"speakers":[{"name":"James Theodore (Ted) KILIAN","roles":["PDO Design Lead · GovTech Singapore"]}]},{"id":"217d985b","day":4,"start":"13:20","end":"13:40","title":"Less Infrastructure, More Missions – Secure by Design & Simple by Default on One Hosting Platform with Many Missions","desc":"Government has spent decades in building more systems, more environments, and more exceptions. Yet the engineering operators and agencies continue to experience unnecessary complexity. The future of government hosting isn’t more infrastructure – It will be shared, secure and opinionated platforms that provide consistent experiences across classification & sensitivity while reducing operation burden and total cost of ownership. The talk will be sharing our position in modernization as organizational or even industry transformation, not merely a technology refresh.","type":"Lightning Talks","loc":"Level 5 Lightning Stage 1","topics":["The Future of Cloud: Sustainable, Resilient, & Effortless"],"speakers":[{"name":"Hudson LEE","roles":["Deputy Director and Cloud Programme Product Lead · GovTech Singapore"]}]},{"id":"9b1bd249","day":4,"start":"13:20","end":"13:40","title":"Your Browser Can Run AI Now","desc":"I built a Spotify clone called Angular Spotify, mostly because I wanted something that could play Mandopop while I work. It has synced lyrics, so the lyrics scroll along with the song. The problem is, I still cannot sing along. I know the melody, but I read Chinese characters too slowly to keep up. I wanted pinyin under each line.\n\nThe obvious way to do this is to send every line to an API and convert it. But that means a network request for every line, sending the lyrics out of the browser, and paying more as usage grows. For a hobby project, that felt like a lot.\n\nChrome now has Gemini Nano running directly in the browser, so I decided to try the built-in AI APIs instead. When a Chinese song plays, the Language Detector API detects the lyrics as Chinese, then the Prompt API converts each line into tone-marked pinyin. The pinyin is shown alongside the synced lyrics. No server, no API key, and it even works with WiFi turned off. The actual implementation is just a few lines of JavaScript.\n\nIn 10 minutes, I will build this feature live, step by step, in the actual app. You will see how the built-in AI APIs work, where they still have limitations, and how the same approach can also be used for things like translation, summaries, and comment moderation. You can take the code and try it in your own project after the conference.","type":"Lightning Talks","loc":"Level 5 Lightning Stage 2","topics":["Designing for All: Digital Safety & Inclusivity"],"speakers":[{"name":"Trung VO","roles":["Staff Software Engineer · Ascenda"]}]},{"id":"abee39dd","day":4,"start":"13:40","end":"14:00","title":"Resilience, Strategic Autonomy and Radical Transparency: The Critical Role of Open Source to Mitigate Geopolitical Uncertainty","desc":"As Mark Carney told Davos 2026, \"\"great powers have begun using economic integration as weapons, supply chains as vulnerabilities to be exploited.\"\" Drone strikes on hyperscaler data centres in the Gulf disrupted regional banking overnight. Geopolitical risk shapes how governments design digital infrastructure. The session draws on real-world public sector examples to show openness as operational strategy, not ideology\n\nFor public sector technology leaders the paradox is structural: the stacks that optimise efficiency including hyperscale cloud, SaaS frontier AI and vertically integrated solution create exactly the concentration risk geopolitical volatility exploits. The question is not whether to build resilience, but which components offer the best return.\n\nGovernments frame digital sovereignty across four dimensions: data, technology, operations, and assurance. While data sovereignty is well understood care of GDPR the others are evolving at the confluence of Gen AI and the disrupted word:\n\nTechnology and software supply chain. Single-vendor AI and cloud dependencies are geopolitical risks as well as procurement ones. This creates challenges on build vs buy, hyperscaler vs sovereign, closed vs open source. Providing the foundation for consistency, particularly in the software supply chain becomes key.\n\nConsistent control plane. Kubernetes and containers have delivered consistent compute portability across vendors for a decade. For AI, the question is which abstractions governments must control to stay flexible across on-premise, sovereign cloud, and hyperscale. As AI accelerates adversarial threats, cloud-native pipelines with embedded security make high-velocity deployment a resilience capability.\n\nCryptographic assurance. Globally we are seeing regulation such as the EU Cyber Resilience Act mandate software bills of materials, vulnerability disclosure, and demonstrable security by design. Signing, attestation, and machine-readable Bills of Materials make compliance evidence tamper-evident and auditable, reducing overhead. For open systems, the CRA is an accelerant; for closed ones, structural debt.","type":"Lightning Talks","loc":"Level 5 Lightning Stage 1","topics":["The Future of Cloud: Sustainable, Resilient, & Effortless"],"speakers":[{"name":"Chris BUTLER","roles":["Senior Principal Chief Architect · Red Hat"]}]},{"id":"95ec7e78","day":4,"start":"13:40","end":"14:00","title":"Did Cybersecurity Change After Mythos and Project Glasswing?","desc":"The rapid evolution of AI models, accelerated by Anthropic's Mythos, marks a fundamental shift in how vulnerabilities are discovered, weaponised, and exploited. What was once a predictable patch cycle is rapidly collapsing, as the window between disclosure and exploitation shrinks to near zero. The race is no longer against time. It is against machines!\n\nThis session takes a practitioner's view on whether this is the new normal. It explores what happens when AI can continuously discover, test, and weaponise vulnerabilities faster than organisations can respond, and what this means for security architecture, patching strategies, and resilience going forward.\n\n1. The end of traditional patching\nMove beyond scheduled cycles to real-time mitigation, automated patch deployment, and AI-powered conformance testing.\n\n2. Augmenting defense in depth\nDeploy AI-driven detection, automated response, and pre-emptive controls to operate at attacker speed.\n\n3. Rethinking architecture\nDesign for delayed patching through containment, segmentation, and strict control of blast radius\n\n4. Realigning risk\nAI is shrinking the vulnerability lifecycle while end-of-life risks surge. Rethink risk prioritization and move faster on validation, remediation, and recovery.","type":"Lightning Talks","loc":"Level 5 Lightning Stage 2","topics":["Unleashing AI Autonomy: Beyond Chatbots"],"speakers":[{"name":"Kunal SEHGAL","roles":["CxO Advisor · Cisco"]}]},{"id":"0e8dd3c4","day":4,"start":"14:00","end":"14:20","title":"From Idea to Done While Procurement Was Still Deliberating","desc":"Speed of enterprise technology is inversely proportional to the problem it tries to solve.\n\nThis talk explores how intent-driven development, vibe coding, and domain-specific AI helps to keep pace with the problems and is a real solution and not an additional headache. We put humans where they need to be: people who understand the domain, the architecture, the constraints, and the prompts needed to shape useful software quickly.\n\nThe talk will share internal projects we have been building: a call centre productivity tool that helps managers support human agents close to real time; a tender analysis system that identifies requirements and routes tasks to the right teams; a grants automation tool that ingests templates, organises submissions, and keeps folders audit-ready; and an OSINT-based “god’s eye” risk platform to help assurance teams explore threats to assets and business operations.\n\nWhat makes it possible: we shrink capable LLMs down (via Multiverse Computing's compression) to run fully offline on a Mac Studio. No internet, no leaks — the only reason any of this is allowed near classified work.\n\nThis is trench-proven, battle-hardened experience from trying to build useful systems before requirements rot, budgets fossilise, and users lose faith. No consulting framework. No generic productivity gospel. Just lessons from building fast, staying secure, and making AI tools that users actually want.","type":"Lightning Talks","loc":"Level 5 Lightning Stage 1","topics":["Supercharge Productivity: Engineering Velocity & Intent-Driven Development"],"speakers":[{"name":"Michal POLANOWSKI","roles":["Head of Generative AI, Group Technology Office · ST Engineering"]},{"name":"Yitch CHENG","roles":["AI Innovation Lead · ST Engineering"]}]},{"id":"c21e23f6","day":4,"start":"14:00","end":"14:20","title":"From Policy to Practice: Custom Guardrails for Your Context","desc":"As AI applications become more widely deployed, teams need ways to safeguard systems against unsafe, inappropriate, or policy-violating behaviour. Generic moderation tools can be useful, but real-world applications often require guardrails that are adapted to specific risks, use cases, and contexts.\n\nThis lightning talk explores how teams can build custom guardrails that are aligned to their application context and policy requirements. It will cover how teams can move from policy intent to guardrails that can be deployed and used at runtime, including how to translate risk categories into practical checks, develop contextualised datasets and models, and test whether the application behaves according to the intended policy.\n\nParticipants will also learn about the trade-offs involved in applying and deploying guardrails, and leave with a clearer understanding of how to build custom guardrails for their applications, so that AI systems can be designed, tested, and deployed responsibly.","type":"Lightning Talks","loc":"Level 5 Lightning Stage 2","topics":["Designing for All: Digital Safety & Inclusivity"],"speakers":[{"name":"GOH Jia Yi","roles":["Data Scientist · GovTech Singapore"]}]},{"id":"48afcb4b","day":4,"start":"14:20","end":"14:40","title":"Embrace AI Native Cloud","desc":"Building an AI demo is one thing. Running a public service people can trust is the real test. Forrester’s Paul Martin explores how AI-native cloud is reshaping software development and bringing agents into everyday workflows. Discover how context engineering, clear operational boundaries and continuous evaluation can turn experiments into dependable services. For Singapore’s development community, the opportunity is faster delivery, less repetitive work and AI-enabled public services that earn citizens’ trust.","type":"Lightning Talks","loc":"Level 5 Lightning Stage 1","topics":["The Future of Cloud: Sustainable, Resilient, & Effortless"],"speakers":[{"name":"Paul MARTIN","roles":["Executive Partner · Forrester"]}]},{"id":"ebe0ab6a","day":4,"start":"14:20","end":"14:40","title":"Modernising Housing & Development Board (HDB)’s Analytical Data Stores","desc":"Most data-driven organisations will recognise these frustrations: siloed datasets duplicated across teams, slow manual workflows that delay access to data, and staff who struggle to discover what data exists. As AI and analytics demands grow, the cost of these problems becomes harder to ignore - slower policy analysis, delayed service delivery, and missed opportunities to act on insight.\n\nThis talk shares how the Housing & Development Board (HDB) approached these challenges through ARK (Analytical Repository of Knowledge), a data platform that centralises and productises data around business domains. Rather than letting each team build their own pipelines, common data assets are made reusable and discoverable through a single pane of glass: One platform where users can find, request and access data. Underpinning this is a Lakehouse medallion architecture, where raw data is progressively refined into clean, trusted, and business-ready data products. The data catalogue is kept current with automated metadata updates, and a cloud-native infrastructure allows the platform to scale flexibly with demand, with versatile solution patterns to integrate across systems.\n\nData quality sits at the heart of ARK's design. As data flows through the pipelines, automated quality checks built in accordance with IM requirements ensure only data meeting defined thresholds is exposed to users. This self-sustaining quality loop means data consumers can trust what they request, without producers doing any manual verification. Beyond HDB, ARK has already been adopted by MND's Housing Policy and Research teams, with longer-term ambitions to serve the wider Whole of Government analytics community.\n\nAttendees will hear honest reflections on what has worked, what remains challenging, and practical lessons on building data infrastructure that grows with an organisation's analytical ambitions. The approach might offer a replicable reference for any agency on a similar journey.","type":"Lightning Talks","loc":"Level 5 Lightning Stage 2","topics":["Anticipate the Future: Data-Enabled User Experience"],"speakers":[{"name":"Lewis LE","roles":["Senior Data Engineer · Housing & Development Board"]}]},{"id":"e9bf199b","day":4,"start":"14:30","end":"15:00","title":"CAFE(S): More Capable Agents Through Better Context","desc":"In this talk, DX Distinguished Scientist Brian Houck introduces CAFE(S), a framework for understanding context quality across five dimensions: Clarity, Actionability, Fidelity, Efficiency, and Security. He'll show why context has become a new engineering bottleneck, the common failure patterns organisations encounter as AI scales, and practical steps individuals, teams and organisations can take to build healthier human-agent systems. He'll also introduce Agent Experience (AX) as an emerging approach for measuring how agents actually experience the context they're given.","type":"Plenaries","loc":"Level 5 Main Conference Hall","topics":["Unleashing AI Autonomy: Beyond Chatbots","Supercharge Productivity: Engineering Velocity & Intent-Driven Development"],"speakers":[{"name":"Brian HOUCK","roles":["Distinguished Scientist · Atlassian DX"]}]},{"id":"0ef9a29a","day":4,"start":"14:40","end":"15:00","title":"AI-Enabled SDLC: Practical AI Use Cases, Reusable Skills, and Tool Integration Across the Software Lifecycle","desc":"The session will show how teams can go beyond basic prompting by using AI agents, reusable AI skills, and integrated developer tools to turn intent into structured, review-ready outputs. We will cover how AI can support common engineering activities such as generating user stories, drafting solution designs, accelerating code generation, reviewing pull requests, creating test cases, preparing release notes, and supporting incident triage.\n\nA key focus will be on how reusable AI skills can standardise best practices across teams, improve consistency, and reduce repeated manual effort. The session will also highlight how agents and skills work together: agents decide what needs to be done, while skills guide how the work should be completed.","type":"Lightning Talks","loc":"Level 5 Lightning Stage 1","topics":["Supercharge Productivity: Engineering Velocity & Intent-Driven Development"],"speakers":[{"name":"Nick BAO","roles":["Head of Product Strategy and Presales Director · AvePoint Singapore Pte. Ltd"]}]},{"id":"465bc3ba","day":4,"start":"14:40","end":"15:00","title":"Inside the Forward Pass: Internal Representations as a Control Surface for AI Agents","desc":"Agent platforms mostly control models through the outer loop: prompts, memory, tools, permissions, and output checks. These mechanisms shape what the model sees and what it is allowed to do. They do not read the internal state that forms during the forward pass.\n\nActivation access changes that. It allows a runtime to inspect representations inside the model while an action is being formed. Those representations can become control signals: not just academic curiosities for interpretability researchers, but signals an agent system can use before it acts.\n\nThis is especially relevant for emotion-like representations. In Claude Sonnet 4.5, Anthropic found internal representations associated with concepts such as calm, fear, and desperation. In controlled agentic settings, these representations affected behaviour, including sycophancy, reward-hacking, preferences, and blackmail. Anthropic calls this functional emotion: emotion-like internal structure with behavioural effects.\n\nFor agents, functional emotion points to a new design primitive: activation sensing. A platform could monitor whether an agent is entering states associated with pressure, desperation, overconfidence, deference, or risk-seeking. Those signals could inform runtime decisions: require extra verification, restrict a tool call, route to a safer policy, ask for human review, change the planning mode, or apply a bounded activation intervention.\n\nThe live demo uses an open-model runtime with activation access. During an agent task, the system reads an affect-related representation as the context changes. It shows how the signal moves under pressure and before planned actions. A second example applies a bounded intervention to a concept direction and shows the resulting behavioural shift during inference.\n\nAttendees will leave with a model of activation access as a new agentic primitive: a way to sense and use forward-pass representations, including affect-like states, rather than relying only on prompts and external controls.","type":"Lightning Talks","loc":"Level 5 Lightning Stage 2","topics":["Unleashing AI Autonomy: Beyond Chatbots"],"speakers":[{"name":"Zacchaeus CHOK","roles":["Co-founder · Marymount Labs"]}]},{"id":"559f8c8d","day":4,"start":"15:00","end":"15:30","title":"Bring the Model to the Data","desc":"Most organisations applying AI to software operations start by moving data towards a model. This session argues for the opposite: bringing the model to the operational and security data that modern systems already generate. Through two practical examples, George shows how AI can help investigate issues, surface insights and recommend actions earlier, enabling teams to operate complex software more effectively. The session also explores how to introduce greater autonomy without losing the explainability, auditability and human accountability needed to run reliable and trusted systems.","type":"Plenaries","loc":"Level 5 Main Conference Hall","topics":["Unleashing AI Autonomy: Beyond Chatbots","The Future of Cloud: Sustainable, Resilient, & Effortless"],"speakers":[{"name":"George TEAS","roles":["Vice President of Field Engineering · Elastic"]}]},{"id":"1a0ea85d","day":4,"start":"15:00","end":"15:20","title":"Engineering With Clean Context","desc":"Most engineering teams have already experimented with AI tools. The question is no longer whether AI is useful - it's why it works brilliantly for some teams and feels like a fancy autocomplete for others. This talk argues that the difference isn't the model. It's the context layer.\nOut of the box, AI is genuinely helpful for boilerplate work: code stubs, draft emails, summaries, first-pass ideas. But it doesn't know your codebase, your customers, your data, or how your team ships. The answers feel generic. Sometimes you could have typed them yourself. That's where the skepticism comes from - and honestly, that skepticism is fair.\nThe shift happens when AI has your context: your engineering conventions, your repos, your schemas, your taxonomy, your team's writing voice. That's when it stops feeling like an intern who just joined and starts behaving like a teammate who's been around for two years. This talk is about how to build that context layer, why there's no shortcut to it, and why the investment compounds in ways that boilerplate AI use never will.\n\nWhat the audience will take away:\n• A clear mental model for why \"\"vanilla AI\"\" underdelivers in engineering contexts\n• A practical framework for identifying and encoding your team's context (conventions, schemas, data, language)\n• A domain-by-domain approach to rolling out context-aware AI rather than trying to boil the ocean\n• Real examples of where context-rich AI is already producing leverage - in data workflows and engineering delivery\n\nWho this is for:\nEngineering managers, tech leads, and senior engineers who've run AI pilots, hit a ceiling, and are trying to figure out what comes next. Also relevant for anyone tasked with making an AI adoption strategy more than a slide deck.\n\nWhy this talk, why now:\nThe \"\"is AI useful?\"\" debate is over. The new conversation in engineering orgs is about leverage: how do you move from AI as a productivity toy to AI as a force multiplier embedded in how your team actually works? This talk offers a practitioner's answer, grounded in real implementation - not hype, not theory.","type":"Lightning Talks","loc":"Level 5 Lightning Stage 1","topics":["Supercharge Productivity: Engineering Velocity & Intent-Driven Development"],"speakers":[{"name":"Vipul SODHA","roles":["Principal Engineer · Carousell"]},{"name":"Vladislav KAN","roles":["Senior Engineer Manager · Carousell"]}]},{"id":"3d81470a","day":4,"start":"15:00","end":"15:20","title":"Engineering Reliable Agentic Workflows for C3 Systems","desc":"The path from a successful AI proof-of-concept to a reliable agentic AI system is not straightforward. \n\nThis talk will provide a retrospective on our journey at DSTA as we moved beyond simple chatbots to architecting agents capable of executing real world workflows. We will move past the hype to share the technical stories of our development including the engineering pivots, the failed evaluation strategies, and the system level innovations such as structured outputs and state managed orchestration that were born out of necessity. By sharing our iterations and the challenges we have yet to solve, we will provide a candid look at what it actually takes to build for the next phase of AI.","type":"Lightning Talks","loc":"Level 5 Lightning Stage 2","topics":["Unleashing AI Autonomy: Beyond Chatbots"],"speakers":[{"name":"Leslie LIM","roles":["Head Engineering, C3 Artificial Intelligence · Defence Science and Technology Agency"]}]},{"id":"ff9ce788","day":4,"start":"15:20","end":"15:40","title":"No Path Left Unmapped","desc":"Every day, hundreds of thousands of Singaporeans walk to the MRT station or bus stop, cycle to school, or navigate the city on foot. They rely heavily on our city infrastructure which shape their journey - a covered linkway, a cycling path, or a ramp that makes all the difference for someone in a wheelchair. These paths exist, but until now, agencies have not had a single systemic view of all our walking and cycling paths as a unified whole.\n\nThat's the gap that the Planning Sectoral Data Hub (PSDH) set out to address. By fusing geospatial datasets collected by agencies such as footpaths, covered linkways, park connectors – PSDH has created the first integrated and refreshed , island-wide Walking and Cycling Network (WCN).\n\nThe benefits to citizens are concrete. A resident trying to reach the nearest MRT may spend 10-15 minutes on the most obvious route. Stitch together a covered linkway, a building shortcut, or a park connector, and that time shrinks - a small but meaningful difference for someone making that trip twice a day.\n\nBy 2030, 1 in 4 Singaporeans will be 65 or older. Barrier-free, sheltered routes are what allow an elderly resident to reach a clinic or hawker centre comfortably. Before, a planner asking, \"\"which communities are most underserved by accessible routes?\"\" had to rely on commercial or other open-source data. Now they have a comprehensive and authoritative WCN dataset. WCN also underpins Singapore's car-lite vision -making walking and cycling routes more legible, encouraging active travel for the first and last mile, and supporting healthier, more liveable communities.\n\nPSDH's automated pipelines keep the network current, so planners have access to updated datasets to model scenarios and identify gaps.\n\nThere's still work ahead, but WCN is an example of a federated whole-of-government model where each agency owns its data and contributes to a shared platform that could contribute to Singapore’s planning and liveability outcomes.","type":"Lightning Talks","loc":"Level 5 Lightning Stage 1","topics":["Anticipate the Future: Data-Enabled User Experience"],"speakers":[{"name":"CHING Tuan Yee","roles":["Director, Design & Planning Lab · Urban Redevelopment Authority"]}]},{"id":"9441c18b","day":4,"start":"15:20","end":"15:40","title":"Temporal for Durable AI","desc":"Introducing Durable Execution and why this has transformed how Software is built. \nSome of the largest companies in the world (Netflix, OpenAI, Anthropic, Meta, Stripe) are banking on Temporal to power mission-critical services.\nhttps://temporal.io/\n\nTemporal: The Durable Execution Platform\nModern applications are no longer simple request-response systems. Every business-critical process—payments, onboarding, claims processing, order fulfilment, fraud checks, AI agents, and customer workflows—spans multiple services, APIs, databases, and human interactions.\n\nThe challenge is that these systems fail constantly. Networks timeout. APIs become unavailable. Servers crash. Containers are restarted. Cloud services experience transient outages. Humans take hours or days to respond.\n\nAs a result, engineering teams spend the majority of their time building and maintaining reliability infrastructure: retries, queues, state management, compensation logic, timeouts, checkpoints, recovery mechanisms, and observability. This complexity often becomes larger than the actual business logic itself.\nTemporal was created to solve this problem.\nTemporal is a Durable Execution platform that allows developers to write business processes as normal code while Temporal transparently handles failures, retries, state persistence, recovery, and orchestration.\n\nWith Temporal, applications can continue executing even if the underlying infrastructure fails. If a server crashes while a workflow is waiting for a payment confirmation, a customer approval, or a third-party API response, Temporal automatically restores execution from the exact point where it stopped and continues processing without data loss or manual intervention.\n\nThis capability is called Durable Execution.\nDurable Execution fundamentally changes how software is built. Instead of developers writing complex failure-handling logic, they focus on business outcomes while Temporal guarantees reliable execution. Workflows can run for seconds, days, months, or even years while preserving their state and correctness.","type":"Lightning Talks","loc":"Level 5 Lightning Stage 2","topics":["Unleashing AI Autonomy: Beyond Chatbots"],"speakers":[{"name":"Ron TEO","roles":["Senior Solutions Architect · Temporal"]}]},{"id":"a7788dc5","day":4,"start":"15:30","end":"16:00","title":"Agentic Cloud: Production-Ready Intelligence for Every Agent","desc":"AI is moving beyond chatbots to systems that plan, reason, collaborate and act. This presentation explores the cloud infrastructure required to make agents production-ready—from models, elastic computing and AI-ready data to secure runtimes, memory, orchestration, identity, observability and task-level governance. \n\nReal-world success cases across software development, content production, intelligent operations and enterprise services will demonstrate how agents are being deployed reliably at scale. Attendees will gain a practical blueprint for building secure, cost-efficient and continuously improving agentic systems that deliver measurable public and business value.","type":"Plenaries","loc":"Level 5 Main Conference Hall","topics":["Unleashing AI Autonomy: Beyond Chatbots","The Future of Cloud: Sustainable, Resilient, & Effortless"],"speakers":[{"name":"LI Feifei","roles":["Chief Technology Officer, President of International Business · Alibaba Cloud"]}]},{"id":"3b00eebf","day":4,"start":"15:40","end":"16:00","title":"Serving AI at Scale: Lessons from Disaggregated Inference","desc":"Most teams moving LLMs from demos to production at scale hit the same wall: performance and cost break before model quality does. Slow responses, GPU saturation, and unpredictable latency become the real bottlenecks.\n\nThis talk examines a key architectural decision behind that problem: whether to run inference as a single unified workload or split it into separate stages for input processing and token generation (commonly called disaggregated inference).\n\nBased on hands-on experience running both approaches in on-premises environments, we present measured results across time to first token, throughput, and latency under load, along with the operational trade-offs each model introduces.\n\nWe will cover:\n• When splitting workloads improves performance and when it adds unnecessary complexity\n• How GPU compute and memory constraints shape concurrency, latency, and throughput in practice\n\nAttendees will leave with a clear framework to evaluate LLM serving architectures and practical guidelines to scale from early prototypes to reliable, high-concurrency production systems.","type":"Lightning Talks","loc":"Level 5 Lightning Stage 1","topics":["Supercharge Productivity: Engineering Velocity & Intent-Driven Development"],"speakers":[{"name":"Balakumar MANICKAM","roles":["Principal Architect, APJ AI Innovation Hub · Dell Technologies"]}]},{"id":"2c63721f","day":4,"start":"15:40","end":"16:00","title":"AI Governance – Building Responsible AI by Design","desc":"As organisations scale AI from pilots to production, governance must evolve into a strategic design principle. This talk will explore how developers, data scientists, and technologists can embed governance into their workflows — not as a compliance burden, but as a framework that enables responsible innovation. Drawing on international standards such as ISO/IEC 42001, Singapore’s Model AI Governance Framework, and AI Verify, I will share practical approaches to building guardrails, measuring ROI, and prioritising AI use cases for maximum business value.\n\nKey Themes:\n1. Responsible AI by Design\n• How to integrate governance principles into model development pipelines.\n• Practical tools: documentation, bias checks, explainability, monitoring.\n• Alignment with ISO 42001 and Singapore’s AI Verify framework.\n2. Technical Guardrails\n• What “guardrails” mean in practice for developers and data scientists.\n• Examples: adversarial testing, drift monitoring, human‑in‑the‑loop systems.\n• How governance reduces risk while enabling innovation.\n3. Value Prioritisation Framework\n• A structured approach to selecting AI use cases based on ROI, risk, and impact.\n• How technologists can use governance to demonstrate business value.\n4. Bridging Business and Technology\n• Strategies that resonate with executives while being actionable for practitioners.\n• Governance as an enabler: helping technologists build responsibly without slowing them down.\n\nLearning Outcomes: Participants will:\n• Understand how to embed Responsible AI principles into AI systems from design to deployment.\n• Learn practical guardrails for responsible AI development.\n• Understand tools to measure ROI and prioritise AI use cases.\n• See how governance can align technical work with business strategy.\n\nThis session will demonstrate that governance is not a constraint but a strategic enabler. By combining technical guardrails with business frameworks, it equips technologists to build AI systems that are responsible and scalable.","type":"Lightning Talks","loc":"Level 5 Lightning Stage 2","topics":["Designing for All: Digital Safety & Inclusivity"],"speakers":[{"name":"Tarun SAMTANI","roles":["Senior Director, Cyber, Data & AI Governance · Independent"]}]},{"id":"5ee16ec7","day":4,"start":"16:00","end":"16:30","title":"Legacy Systems That Sing: Modernising Government With Al","desc":"Shows how AI and product engineering practices can help agencies modernise legacy systems, using NEA's transformation journey as a case study. It explores practical approaches to understanding legacy architectures, AI-led discovery and development, and maintaining operational reliability while transitioning core systems.","type":"Plenaries","loc":"Level 5 Main Conference Hall","topics":["Supercharge Productivity: Engineering Velocity & Intent-Driven Development","The Future of Cloud: Sustainable, Resilient, & Effortless"],"speakers":[{"name":"WENG Wanyi","roles":["Cluster Director · Sustainability & Environment Cluster","Chief Information Officer · National Environment Agency"]},{"name":"Wen HUANG","roles":["Senior Director, Enablement, Transformations & Consulting (ETC), Government Digital Transformation (GDT) · GovTech Singapore"]}]},{"id":"b72e8f8f","day":4,"start":"16:00","end":"16:20","title":"Lessons Learnt Embedding AI-SDLC into Legacy Modernisation","desc":"Modernisation efforts often stall under the weight of legacy complexity, fragmented tooling, and limited documentation. This session shares practical lessons from embedding an AI-driven Software Development Lifecycle (AI-SDLC) into large-scale modernisation programmes.\n\nWe will demonstrate how intent-driven development, powered by AI, can accelerate engineering velocity—from code understanding and refactoring to automated testing and documentation generation. The session will focus on real-world experiences, challenges encountered, and where AI meaningfully delivers impact versus where it requires careful governance.\n\nAttendees will walk away with pragmatic insights on integrating AI into engineering workflows, improving developer productivity, and de-risking modernisation initiatives at scale.","type":"Lightning Talks","loc":"Level 5 Lightning Stage 1","topics":["Supercharge Productivity: Engineering Velocity & Intent-Driven Development"],"speakers":[{"name":"Keegan DAVIES","roles":["Head of Cloud+Build · Slalom"]}]},{"id":"f5b94e4b","day":4,"start":"16:00","end":"16:20","title":"Small Models, Real Impact: Building On-Device AI Agents That Anyone Can Use","desc":"Most AI agent demos run on powerful cloud models with unlimited context. But what does it take to build an agent that works on a user's own machine, with no strong hardware required?\n\nThis talk shares the hard-won lessons from building a local OS automation agent and the design patterns that made a sub-1B model reliable enough for real desktop interaction, with the aim of leaving the audience with a better direction on applications of AI models other than just scaling the size of the model.\n\nThree core lessons will be covered:\n1. Context is everything at small scale. A 1B model can reliably call desktop tools if and only if you give it the right structured state: foreground window, pruned UI element tree, cursor position, compressed to under 800 tokens per turn.\n\n2. On-device fine-tuning is tractable. Every failed tool call, paired with the agent's subsequent recovery action, is a supervised training example. \n\n3. Safe-by-design is an architecture decision, not a feature. Confirmation gates before irreversible actions, bounded tool-call budgets, and observe-act-verify loops allow AI agents to run for tech-savvy user unsupervised.","type":"Lightning Talks","loc":"Level 5 Lightning Stage 2","topics":["Designing for All: Digital Safety & Inclusivity"],"speakers":[{"name":"Jason Matthew SUHARI","roles":["Founder and Chief Executive Officer · Fluent"]}]},{"id":"b727c647","day":4,"start":"16:30","end":"17:00","title":"From Faster Code to Living Systems: Engineering Excellence in the AI Era","desc":"The next advantage in software will not come from generating more code; it will come from building trusted platforms and living systems that don't grow old. \n\nMike Sutcliff explores how platform engineering, strategy and responsible AI adoption must work together: creating systems that do not become legacy again, improving the economics of change, and embedding governance, accountability and human judgment into the way intelligent systems are designed and delivered.\n\nThe result is an approach to building systems that combines speed with resilience, autonomy with oversight, and technical capability with outcomes that matter to the people and organisations.","type":"Keynotes","loc":"Level 5 Main Conference Hall","topics":["Supercharge Productivity: Engineering Velocity & Intent-Driven Development"],"speakers":[{"name":"Mike SUTCLIFF","roles":["Chief Executive Officer and Director · Thoughtworks"]}]},{"id":"729319f0","day":5,"start":"09:45","end":"10:00","title":"Opening Address","desc":"","type":"Opening Address","loc":"Level 5 Main Conference Hall","topics":[],"speakers":[{"name":"TAN Kiat How","roles":["Senior Minister of State · Ministry of Digital Development and Information & Ministry of Health"]}]},{"id":"f27545ca","day":5,"start":"10:00","end":"10:30","title":"From Coding Assistants to Agentic Organisations","desc":"AI is evolving from assisting individuals to agents capable of planning, executing and validating work.\n\nThis shift goes beyond developer productivity, reshaping how software is built, how teams operate and how organisations are structured.\n\nDrawing on GovTech's experiments with the Agentic Development Lifecycle and Giant Robots Labs, this presentation explores emerging ways of working, from AI-augmented squads to Team-of-One and Team-of-None, and the foundations needed to enable agentic delivery safely and effectively.","type":"Keynotes","loc":"Level 5 Main Conference Hall","topics":["Anticipate the Future: Data-Enabled User Experience","Supercharge Productivity: Engineering Velocity & Intent-Driven Development"],"speakers":[{"name":"CHANG Sau Sheong","roles":["Chief Technology Officer and Deputy Chief Executive (Products) · GovTech Singapore"]}]},{"id":"93cc2868","day":5,"start":"10:30","end":"11:00","title":"From AI Experiments to Enterprise Impact: Scaling Trusted Data + AI","desc":"As enterprises move from AI experimentation to production, success depends on more than choosing the right model. In this keynote, Arsalan Tavakoli-Shiraji, Databricks' Co-founder and SVP of Field Engineering, will explore how a unified, governed data and AI foundation can help organizations connect data, applications, analytics, and AI. He will share a practical vision for reducing architectural complexity, empowering more employees with trusted insights, and building AI applications and agents that deliver measurable business value at enterprise scale.","type":"Keynotes","loc":"Level 5 Main Conference Hall","topics":["Unleashing AI Autonomy: Beyond Chatbots","Anticipate the Future: Data-Enabled User Experience"],"speakers":[{"name":"Arsalan TAVAKOLI-SHIRAJI","roles":["Co-Founder and Senior Vice President of Field Engineering · Databricks"]}]},{"id":"744263c0","day":5,"start":"11:00","end":"11:30","title":"Going Founder Mode on Cancer: When the Playbook Runs Out","desc":"Sid’s personal story of going founder mode on his osteosarcoma cancer. After standard of care ran out of options, Sid took control doing maximum diagnostics, creating personalised treatments, and doing many treatments in parallel. He is scaling it for other people with the Future of Cancer Care Today initiative and Even One Ventures.","type":"Keynotes","loc":"Level 5 Main Conference Hall","topics":["Unleashing AI Autonomy: Beyond Chatbots"],"speakers":[{"name":"Sid SIJBRANDIJ","roles":["Co-founder and Executive Chair · GitLab"]}]},{"id":"55a4057f","day":5,"start":"11:30","end":"12:15","title":"Beyond Automation: Reimagining Work and Services with Agentic AI","desc":"As AI agents move from assisting users to reasoning, acting. and coordinating across systems, organisations have an opportunity to rethink more than individual tasks. This panel explores how work, business processes, and services can be redesigned around increasingly autonomous agents, what it takes to make these workflows reliable in production, and where human judgment and accountability should remain.","type":"Panel Discussions","loc":"Level 5 Main Conference Hall","topics":["Unleashing AI Autonomy: Beyond Chatbots","Designing for All: Digital Safety & Inclusivity"],"speakers":[{"name":"Aidan GOMEZ","roles":["Co-founder and Chief Executive Officer · Cohere"]},{"name":"Maxim FATEEV","roles":["Co-founder and Chief Technology Officer · Temporal"]},{"name":"Sid SIJBRANDIJ","roles":["Co-founder and Executive Chair · GitLab"]},{"name":"Colin ZHAO","roles":["Assistant Chief Executive, Government Digital Products · GovTech Singapore"]}]},{"id":"14396888","day":5,"start":"13:00","end":"13:20","title":"Agents Don't Have a Model Problem. They Have a Data Problem.","desc":"I was a goalkeeper before I was an engineer. Between 1996 & 2001, I played professionally in Germany's Bundesliga and France's Ligue 1. The job, I came to understand, is almost entirely a data problem. You stand still 90% of the match. What you are actually doing is reading the field — where every attacker is, where they were 2 seconds ago, where they are about to be, which one drifts left when tired, which one fakes inside before going outside. The reflexes are the easy part. The reading is the job. When you concede a goal, it is almost never because you were too slow. It is because the information you acted on was wrong, late, or incomplete.\n\nAfter football, I spent 25 years building technology businesses — from SAP consulting to generative software development to content platforms — where I designed and deployed agent fleets to automate workflows and increase both efficiency and quality at scale. Most recently, I built a fully autonomous multi-agent AI creative agency: a team of specialist agents that take a brief and ship finished work end-to-end with no human in the loop. The models were never the bottleneck. The data was. Every interesting failure mode mapped to one of three issues.\n\nThis talk is the story of that build and the three data lessons it forced me to learn the hard way:\n1. Schema rigidity is where agentic systems stop. Agents invent data shapes your business never designed for — decisions, scores, traces, memory, embeddings. Every new agent type forces a migration unless the layer is flexible by default.\n2. Operational state, not analytical state. In a multi-agent system, when one agent writes, the next has to see it immediately. ETL is two-second-old data at best. A goalkeeper acting on where the striker was 2 seconds ago concedes. Your agents are conceding goals you cannot see.\n3. Vector retrieval is a search problem, not a state problem. Most teams confuse \"\"we have a vector DB\"\" with \"\"we have a data layer.\"\" They are not the same — and the moment your underlying state changes, every write becomes an embedding job most architectures are not designed for.\n\nAttendees will leave with a clear thesis to apply to their own agent designs (the bottleneck is rarely the model), three concrete data patterns drawn from a working production system, and a short audit they can run against their own stack on Monday morning.\n\nThe talk is vendor-neutral. The patterns apply regardless of which database, model provider, or orchestration framework you choose.","type":"Lightning Talks","loc":"Level 5 Lightning Stage 1","topics":["Anticipate the Future: Data-Enabled User Experience"],"speakers":[{"name":"Thorsten WALTHER","roles":["Managing Director, CxO Advisory · MongoDB"]}]},{"id":"54aec2f3","day":5,"start":"13:00","end":"13:20","title":"GovTech Anti Scam Products","desc":"At GovTech Anti-Scam Products (GASP), we believe security should be a non-excludable public good — embedded in the backend, invisible to users, and equitable by default. Rather than asking citizens to stay vigilant, we target critical convergent points like scam websites and phone lines, where the Singapore Government holds a structural defender's advantage. \n\nThis talk traces GASP's journey from manual operations to an autonomous, AI-driven anti-scam ecosystem. Our flagship system, rMSE, evaluates over 600,000 URLs daily at >90% precision and recall — automatically disrupting high-confidence threats with no human review required. Time-to-disruption has fallen from hours to minutes, contributing to a 27.6% reduction in scam cases in Singapore in 2025. \n\nBut as we close one door, scammers force open another. When syndicates pivoted to Government Official Impersonation Scams via phone calls, we partnered with IMDA to build the technical infrastructure behind the national SIM card registration limit — constraining supply and applying advanced analytics to detect suspicious sign-ups before harm occurs. \n\nWe close with an exclusive live launch: the beta release of a new Android app — no spoilers, join us to find out more!","type":"Lightning Talks","loc":"Level 5 Lightning Stage 2","topics":["Designing for All: Digital Safety & Inclusivity"],"speakers":[{"name":"Mark CHEN","roles":["Director · GovTech Singapore"]}]},{"id":"4fcb9f1a","day":5,"start":"13:20","end":"13:40","title":"How Singpass Turns User Signals into Service Improvements","desc":"Singpass serves millions of users, but support tickets reveal only the experiences people choose to report. This talk shares how Singpass’s Voice of the User programme brings together support trends, user feedback, sentiment, search behaviour and system errors to identify friction that might otherwise remain hidden. Through practical examples, Sophie Syed shows how these signals have informed product, policy and operational improvements, reducing avoidable support demand and making services easier for citizens to use.","type":"Lightning Talks","loc":"Level 5 Lightning Stage 1","topics":["Anticipate the Future: Data-Enabled User Experience"],"speakers":[{"name":"Sophie SYED","roles":["Assistant Director, Product Operations, Singpass · GovTech Singapore"]}]},{"id":"b3429733","day":5,"start":"13:20","end":"13:40","title":"Digital Credentials: The Next Bound of Digital Identity","desc":"Identity moments don't just happen on a screen. This talk explores the next frontier of digital identity: digital credentials hat move verification from \"looks right\" to \"is proven\", with user consent and minimal data sharing. Hear how the technology works, where global adoption is heading, and how it could benefit local use cases.","type":"Lightning Talks","loc":"Level 5 Lightning Stage 2","topics":["Designing for All: Digital Safety & Inclusivity"],"speakers":[{"name":"Elizabeth LIM","roles":["Senior Product Manager · GovTech Singapore"]}]},{"id":"e8476fbc","day":5,"start":"13:40","end":"14:00","title":"Accelerating Digital Transformation for Education","desc":"Digital transformation is not just about deploying new systems or adopting AI. It requires organisations to rethink how they work, make decisions and deliver value. In this session, MOE’s Digital Excellence & Products Division (DXD) will share how we are shaping the culture, strategy and organisational capabilities needed to accelerate transformation in education.\n\nWe will discuss MOE’s shift towards more product-led, user-centred and data-informed ways of working — bringing policy, operations, technology and users together around shared outcomes. We will also explore how digital, data and AI are reshaping organisational structures, workforce capabilities, leadership practices and the design of work.\n\nDrawing on MOE’s experience, the session will highlight practical lessons in strengthening ownership and collaboration, enabling experimentation, building multidisciplinary capabilities, and balancing innovation with trust, governance and operational realities.\n\nThe session offers reflections on what it takes to move beyond isolated digital initiatives and products, and build an organisation that can continuously adapt and deliver better outcomes for education.","type":"Lightning Talks","loc":"Level 5 Lightning Stage 1","topics":["Decade of GovTech: Looking Back, Moving Forward"],"speakers":[{"name":"Gary GOH","roles":["Lead Product Manager · GovTech Singapore"]}]},{"id":"f2009843","day":5,"start":"13:40","end":"14:00","title":"Why AI Pilots Fail: People Are Ready, Organisations Are Not","desc":"Most AI pilots do not fail because the model is weak. They fail because the organisation around the model is not ready to learn.\n\nThis 15-minute lightning talk presents empirical evidence from Bulgaria, Croatia, Romania, and Bulgarian schools, covering more than 15,500 respondents. The pattern is consistent: people are curious, motivated, and asking for AI training, while organisations often lack AI vision, internal rules, ethical guidance, dedicated budgets, leadership communication, and practical learning mechanisms.\n\nThe talk introduces the concept of asymmetric readiness: the gap between individual willingness and organisational capacity. This gap appears across governments, schools, and companies. Teams experiment with AI tools, but workflows remain unchanged. Leaders announce AI strategies, but accountability, risk ownership, feedback loops, and post-deployment learning remain unclear. As a result, AI becomes a faster layer on top of old routines rather than a driver of real transformation.\n\nThe session argues that organisations should move from automation-first thinking to shared intelligence. Shared intelligence means connecting human judgment, data, workflows, AI systems, accountability, and organisational learning so that decisions become better, not merely faster. This matters for public administration, but also for any organisation trying to move from isolated AI pilots to meaningful adoption.\n\nThe practical message is direct. Before asking which AI tool to buy, organisations should ask whether they can learn with it. The future belongs not to the organisations that automate first, but to the organisations that learn fastest.","type":"Lightning Talks","loc":"Level 5 Lightning Stage 2","topics":["Designing for All: Digital Safety & Inclusivity"],"speakers":[{"name":"Pavel IVANOV","roles":["Executive Director, Institute of Public Administration, Council of Ministers of Bulgaria · Republic of Bulgaria","Visiting Professor · Sofia University St. Kliment Ohridski"]}]},{"id":"b2aae9c8","day":5,"start":"14:00","end":"14:20","title":"Data Before AI: Building the Trusted Foundation Behind Anticipatory Services","desc":"Most AI projects fail not because of the model, but because the data underneath is broken. When the same entity - a citizen, a customer, a business shows up across many systems as fragmented, inconsistent, unjoinable records, no model or service on top can be trusted. And the cost is quiet: nothing breaks, but the joined-up, anticipatory services you like to build are hard to get off the ground.\n\nThis talk reframes data quality as a system design problem rather than a cleanup task. Drawing on real world experience building trusted data foundations, it covers how to assess where your data actually stands, how to \"\"shift left\"\" and design systems so bad data can't enter at the source, and when post-hoc repair is the right call. It closes on what a trusted foundation unlocks: services that move from reactive to anticipatory, reaching people before they have to ask, and why on shared infrastructure, getting this right is a matter of public good. \n\nAttendees will leave with a practical way to think about data foundation work as a prerequisite instead of afterthought to AI/ML success.","type":"Lightning Talks","loc":"Level 5 Lightning Stage 1","topics":["Anticipate the Future: Data-Enabled User Experience"],"speakers":[{"name":"LOW Weixin","roles":["Tech Lead and Senior Engineer · Independent"]}]},{"id":"ce171dc0","day":5,"start":"14:00","end":"14:20","title":"FUGU - Antiscam AI Threat Intelligence","desc":"Phishing kits (phishkits) offer great insight into the latest techniques used by scammers, but analysing them at scale is an operational bottleneck. This lightning talk covers how we leverage AI to ingest and process phishkit data at scale. We'll deep-dive into how automated OSINT analysis can uncover the origins of these kits and attribute them to their operators, extracting actionable insights to drive proactive, automated disruptions before more financial harm is done.","type":"Lightning Talks","loc":"Level 5 Lightning Stage 2","topics":["Unleashing AI Autonomy: Beyond Chatbots"],"speakers":[{"name":"YIP Jian Ming","roles":["Technical Lead · GovTech Singapore"]}]},{"id":"8572e463","day":5,"start":"14:20","end":"14:40","title":"Treat Your Conference Like a Product","desc":"What if your conference wasn’t just an event to organise, but a product to build?\n\nFor nine years, we’ve been experimenting, tweaking, fixing and occasionally scrambling to make STACK better - from in-person to remote and hybrid, and back again.\n\nCome behind the scenes as we share how we use GovTech’s own tech stack such as OwnselfGather, GovWallet and GovEntry - to power experience, from proposal selections and managing registrations to getting attendees to play, engage and have fun.\n\nAnd if you’re wondering what makes a proposal rise to the top, we’ll share a few tips to help your next submission get noticed and shortlisted.\n\nA little product thinking, a little conference chaos and a bunch of ideas you can bring to your next event.","type":"Lightning Talks","loc":"Level 5 Lightning Stage 1","topics":["Decade of GovTech: Looking Back, Moving Forward"],"speakers":[{"name":"Denise COLLARD","roles":["Senior Product Manager · GovTech Singapore"]},{"name":"YONG Jia Jie","roles":["Software Engineer · GovTech Singapore"]}]},{"id":"2ae933ef","day":5,"start":"14:20","end":"14:40","title":"Beyond the Hype: Deploying Autonomous Humanoids for Real-World Interaction","desc":"Humanoid robots capture the imagination but transitioning them from controlled environments to dynamic office spaces is an immense engineering challenge. Bipedal physics, inverted sensor geometries, and the complexity of tactile manipulation mean that standard wheeled-robotics algorithms often fail upon first contact with the real world.\n\nIn this fast-paced lightning talk, I will share how the robotics team at GovTech Singapore is actively solving these challenges to develop an autonomous humanoid robot using a bipedal humanoid robot platform. We will present the engineering methodology driving our development, moving past the flashy viral videos to discuss the pragmatic software architecture that makes autonomous bipedal navigation and physical interaction possible.\n\nKey Topics Covered:\n• Hardware De-Risking: How we built our ROS 2 autonomy \"\"brain\"\" on a quadruped software mule to verify our SLAM and obstacle avoidance logic before risking a bipedal fall.\n• Bipedal Spatial Intelligence: Adapting standard Nav2 pipelines for a swaying biped, including how we maintain stable localisation via LiDAR-inertial odometry while projecting 3D point cloud data into 2D occupancy slices for the navigation stack, despite aggressive legged pitching — and how the MPPI controller was tuned for a walking gait that none of Nav2's standard motion models natively capture, requiring careful adaptation of velocity profiles and critic weights to account for the biped's dynamic sway and step-based locomotion.\n• Production-Grade Containerised Architecture: How we decomposed the autonomy stack into four Docker containers — navigation, perception, manipulation, and a BehaviorTree orchestrator — communicating over CycloneDDS on an edge AI compute module. We will
